# Runner ingress policy — trust boundary documentation.
#
# Trust model:
#   - Operator authentication (X-Runner-Token via ClusterAuthLayer) is the
#     primary access boundary.  Config, secrets, deploy, undeploy, migrate,
#     and repository mutation routes all require a valid token in cluster mode.
#   - NetworkPolicy provides defence-in-depth: the runner-to-runner rule
#     ensures cross-pod A2A forwarding works even if the external rule is
#     tightened to a specific ingress controller.
#   - The external-access rule allows any source on port 18080 so that
#     kubectl port-forward and ingress controllers work.  Narrowing this
#     to a specific namespace or CIDR is a production-hardening step;
#     operator auth prevents unauthorised mutations regardless.
#
# Cross-runner A2A forwarding (runner-to-runner rule) is unauthenticated at
# the application layer. The trust boundary is the cluster fabric perimeter,
# not the NetworkPolicy: the external-access rule below is intentionally
# permissive on the runner port, so the runner-to-runner rule is subsumed
# until the external rule is tightened. Operator endpoints on the same port
# are protected separately by X-Runner-Token in cluster mode.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-ingress
  namespace: agentium
spec:
  podSelector:
    matchLabels:
      app: runner
  policyTypes:
    - Ingress
  ingress:
    # Runner-to-runner: cross-pod A2A forwarding and migration.
    # Keeps forwarding working if the external rule below is later
    # tightened; not the trust boundary on its own (external rule below
    # is permissive — see the header comment).
    - from:
        - podSelector:
            matchLabels:
              app: runner
      ports:
        - protocol: TCP
          port: 18080
    # External access: kubectl port-forward, ingress controllers, and
    # operator tooling.  Operator routes require X-Runner-Token; public
    # routes (discovery, A2A, health) are intentionally open.
    - ports:
        - protocol: TCP
          port: 18080
---
# SurrealDB ingress: only runner pods may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: surrealdb-ingress
  namespace: agentium
spec:
  podSelector:
    matchLabels:
      app: surrealdb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: runner
      ports:
        - protocol: TCP
          port: 8000
