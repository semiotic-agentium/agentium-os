apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: agentium
servers: 1
agents: 2
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
# Local registry contract powering `--image-strategy registry` in
# scripts/verify-k8s-pilot-package.sh: a `registry:2` container named
# `k3d-agentium-registry` is started (and attached to this cluster's
# docker network) by the bringup helpers in scripts/e2e-k8s/lib.sh.
# The host pushes to localhost:5400; kubelet inside the cluster pulls
# from k3d-agentium-registry:5000, resolved via the containerd mirror
# block injected below. hostPort 5400 avoids the macOS AirPlay Receiver
# default on port 5000.
#
# Plain `docker run` is used instead of `registries.create` because k3d's
# managed registry path is not portable across Docker and Podman: it
# attaches the registry container to a `bridge` network that does not
# exist under rootful Podman (where `bridge` is a reserved network mode
# keyword and cannot be created).
#
# KEEP IN SYNC WITH scripts/e2e-k8s/lib.sh: the mirror key and endpoint
# hostname below must match `k3d-${REGISTRY_NAME}:${REGISTRY_CONTAINER_PORT}`.
registries:
  config: |
    mirrors:
      "k3d-agentium-registry:5000":
        endpoint:
          - "http://k3d-agentium-registry:5000"
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      # Pin kubelet upstream resolver so CoreDNS (dnsPolicy: Default) does not
      # inherit the Docker network DNS, which SERVFAILs on openrouter.ai /
      # slack.com on some hosts. App pods stay on ClusterFirst → service DNS
      # is unaffected; CoreDNS forwards externally via 1.1.1.1 / 8.8.8.8.
      - arg: --kubelet-arg=resolv-conf=/etc/agentium-resolv.conf
        nodeFilters:
          - server:*
          - agent:*
  # Set the node container's resolver via Docker `--dns`, so containerd image
  # pulls (registry-1.docker.io, ghcr.io, openrouter, …) resolve. The kubelet
  # `--resolv-conf` arg above only affects pods; containerd reads the node's
  # own /etc/resolv.conf, which Docker populates from `--dns`.
  runtime:
    extraArgs:
      - arg: --dns=1.1.1.1
        nodeFilters:
          - server:*
          - agent:*
      - arg: --dns=8.8.8.8
        nodeFilters:
          - server:*
          - agent:*
files:
  # Source path is relative to the k3d config file directory (deploy/k3d/).
  - source: resolv.conf
    destination: /etc/agentium-resolv.conf
    nodeFilters:
      - server:*
      - agent:*
