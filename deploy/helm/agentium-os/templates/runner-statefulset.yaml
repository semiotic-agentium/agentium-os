{{- $fullname := include "agentium-os.runner.fullname" . -}}
{{- $surrealFullname := include "agentium-os.surrealdb.fullname" . -}}
{{- $surrealSecret := required "surrealdb.auth.existingSecret is required" .Values.surrealdb.auth.existingSecret -}}
{{- $runnerSecret := required "runner.auth.existingSecret is required — cluster mode requires a runner token" .Values.runner.auth.existingSecret -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "agentium-os.runner.labels" . | nindent 4 }}
spec:
  # serviceName must match the headless service metadata.name for pod DNS.
  serviceName: {{ $fullname }}
  replicas: {{ .Values.runner.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentium-os.runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentium-os.runner.labels" . | nindent 8 }}
    spec:
      containers:
        - name: runner
          image: "{{ required "runner.image.repository is required — no published runner image exists yet" .Values.runner.image.repository }}:{{ required "runner.image.tag is required" .Values.runner.image.tag }}"
          imagePullPolicy: {{ .Values.runner.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --serve-http
            - "0.0.0.0:{{ .Values.runner.service.headless.port }}"
            - --surreal-endpoint
            # Production deployments should use wss:// with TLS termination.
            - "ws://{{ $surrealFullname }}.{{ .Release.Namespace }}.svc:{{ .Values.surrealdb.service.port }}"
            - --state-dir
            - /data/runner-state
            - --repository-dir
            - /data/repository
          ports:
            - containerPort: {{ .Values.runner.service.headless.port }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Per-pod addressing for cross-runner A2A forwarding.
            - name: RUNNER_ENDPOINT
              value: "http://$(POD_NAME).{{ $fullname }}.{{ .Release.Namespace }}.svc:{{ .Values.runner.service.headless.port }}"
            - name: SURREAL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $surrealSecret }}
                  key: {{ .Values.surrealdb.auth.usernameKey }}
                  optional: false
            - name: SURREAL_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ $surrealSecret }}
                  key: {{ .Values.surrealdb.auth.passwordKey }}
                  optional: false
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $runnerSecret }}
                  key: {{ .Values.runner.auth.secretKey }}
                  optional: false
            {{- if .Values.fnox.config.existingConfigMap }}
            - name: BAML_FNOX_CONFIG
              value: /config/fnox.toml
            {{- end }}
            {{- if .Values.observability.enabled }}
            # OTEL pilot contract — see docs/reference/otel-metrics-instrumentation-guide.md and
            # docs/reference/otel-trace-instrumentation-guide.md. Resource attrs compose with the
            # in-process helper so `service.instance.id` on resources, spans, and metrics
            # cannot drift.
            - name: OTEL_SERVICE_NAME
              value: "agentium-runner"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=agentium,deployment.environment={{ coalesce .Values.observability.environment .Values.global.environment "pilot" }},service.instance.id=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE)"
            {{- if .Values.observability.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otlpEndpoint | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.runner.logging.rustLog }}
            - name: RUST_LOG
              value: {{ . | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: npm-cache
              mountPath: /tmp/npm-cache
            {{- if .Values.fnox.config.existingConfigMap }}
            - name: fnox-config
              mountPath: /config/fnox.toml
              subPath: {{ .Values.fnox.config.key }}
              readOnly: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.runner.service.headless.port }}
            initialDelaySeconds: {{ .Values.runner.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.runner.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.runner.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.runner.startupProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.runner.service.headless.port }}
            initialDelaySeconds: {{ .Values.runner.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.runner.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.runner.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.runner.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.runner.service.headless.port }}
            initialDelaySeconds: {{ .Values.runner.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.runner.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.runner.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.runner.readinessProbe.failureThreshold }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: npm-cache
          emptyDir: {}
        {{- if .Values.fnox.config.existingConfigMap }}
        - name: fnox-config
          configMap:
            name: {{ .Values.fnox.config.existingConfigMap }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.runner.persistence.storageClass }}
        storageClassName: {{ .Values.runner.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.runner.persistence.size }}
