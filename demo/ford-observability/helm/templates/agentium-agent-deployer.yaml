{{- $secretName := default "agentium-demo-secrets" .Values.existingSecrets.name -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: agentium-demo-agent-deployer
  labels:
    app.kubernetes.io/name: agentium-demo-agent-deployer
    app.kubernetes.io/component: agents
    app.kubernetes.io/part-of: agentium-observability-demo
  annotations:
    checksum/agents: {{ include (print $.Template.BasePath "/agentium-agents-configmap.yaml") . | sha256sum }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentium-demo-agent-deployer
        app.kubernetes.io/component: agents
        app.kubernetes.io/part-of: agentium-observability-demo
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: unpack-demo-agents
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - mkdir -p /agents && tar -xf /agent-bundle/demo-agents.tar -C /agents --strip-components=1
          volumeMounts:
            - name: agent-bundle
              mountPath: /agent-bundle
              readOnly: true
            - name: agents
              mountPath: /agents
        - name: wait-for-runner
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              RUNNER_URL="http://{{ .Values.agentiumRunner.service.name }}:{{ .Values.agentiumRunner.service.port }}"
              until wget -q -O- "$RUNNER_URL/readyz" >/dev/null 2>&1; do
                echo "waiting for runner at $RUNNER_URL"
                sleep 5
              done
      containers:
        - name: push-agents
          image: "{{ .Values.agentiumRunner.deployAgentsImage.repository }}:{{ .Values.agentiumRunner.deployAgentsImage.tag }}"
          imagePullPolicy: {{ .Values.agentiumRunner.deployAgentsImage.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              RUNNER_URL="http://{{ .Values.agentiumRunner.service.name }}:{{ .Values.agentiumRunner.service.port }}"
              for agent_dir in \
                /agents/observability-coordinator \
                /agents/grafana-investigator \
                /agents/slack-notify; do
                baml-agent-builder publish \
                  --agent-dir "$agent_dir" \
                  --repository-url "$RUNNER_URL/repository" \
                  --deploy-url "$RUNNER_URL" \
                  --runner-token "${RUNNER_TOKEN:-}"
              done
          env:
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ .Values.existingSecrets.runnerTokenKey }}
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ .Values.existingSecrets.openrouterApiKeyKey }}
                  optional: false
          volumeMounts:
            - name: agents
              mountPath: /agents
              readOnly: true
      volumes:
        - name: agents
          emptyDir: {}
        - name: agent-bundle
          configMap:
            name: agentium-demo-agents
