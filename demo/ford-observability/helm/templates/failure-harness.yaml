{{- $repo := default (printf "%s/failure-harness" .Values.images.registry) .Values.services.failureHarness.image.repository -}}
{{- $tag := default .Values.images.tag .Values.services.failureHarness.image.tag -}}
{{- $secretName := default "agentium-demo-secrets" .Values.existingSecrets.name -}}
apiVersion: v1
kind: Service
metadata:
  name: failure-harness
  labels:
    app.kubernetes.io/name: failure-harness
    app.kubernetes.io/component: failure-injection
    app.kubernetes.io/part-of: agentium-observability-demo
spec:
  selector:
    app.kubernetes.io/name: failure-harness
  ports:
    - name: http
      port: {{ .Values.services.failureHarness.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: failure-harness
  labels:
    app.kubernetes.io/name: failure-harness
    app.kubernetes.io/component: failure-injection
    app.kubernetes.io/part-of: agentium-observability-demo
spec:
  serviceName: failure-harness
  replicas: {{ .Values.services.failureHarness.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: failure-harness
  template:
    metadata:
      labels:
        app.kubernetes.io/name: failure-harness
        app.kubernetes.io/component: failure-injection
        app.kubernetes.io/part-of: agentium-observability-demo
    spec:
      containers:
        - name: failure-harness
          image: "{{ $repo }}:{{ $tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: LEDGER_DB_PATH
              value: /data/failure-harness/ledger.sqlite
            - name: CHECKOUT_API_URL
              value: "http://checkout-api:{{ .Values.services.checkoutApi.port }}"
            - name: GRAFANA_URL
              value: "http://grafana:{{ .Values.grafana.service.port }}"
            - name: GRAFANA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ .Values.existingSecrets.grafanaApiTokenKey }}
                  optional: true
            - name: RUST_LOG
              value: "info"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
{{ toYaml .Values.services.failureHarness.resources | indent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.services.failureHarness.storage }}
