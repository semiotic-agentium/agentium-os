{{- if not .Values.existingSecrets.name }}
apiVersion: v1
kind: Secret
metadata:
  name: agentium-demo-secrets
  labels:
    app.kubernetes.io/name: agentium-demo-secrets
    app.kubernetes.io/part-of: agentium-observability-demo
type: Opaque
stringData:
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
  GRAFANA_API_TOKEN: {{ .Values.secrets.grafanaApiToken | quote }}
  SLACK_BOT_TOKEN: {{ .Values.secrets.slackBotToken | quote }}
  SLACK_USER_TOKEN: {{ .Values.secrets.slackUserToken | quote }}
  SLACK_NOTIFY_CHANNEL_ID: {{ .Values.secrets.slackNotifyChannelId | quote }}
  RUNNER_TOKEN: {{ .Values.agentiumRunner.runnerToken | quote }}
{{- end }}
