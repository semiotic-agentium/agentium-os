images:
  registry: ghcr.io/semiotic-ai/agent-platform-demo
  tag: latest
  pullPolicy: IfNotPresent

namespaceOverride: ""

secrets:
  openrouterApiKey: ""
  grafanaAdminPassword: "admin"
  # Optional Grafana service account token for failure-harness annotation writes.
  grafanaApiToken: ""
  # Duplicate of grafanaApiToken under the env name expected by most Grafana MCP servers.
  grafanaApiKey: ""
  slackBotToken: ""
  slackUserToken: ""
  slackNotifyChannelId: ""

existingSecrets:
  # If set, runner env pulls keys from this Secret instead of generated demo secret.
  # Expected keys default to env var names below.
  name: ""
  openrouterApiKeyKey: OPENROUTER_API_KEY
  grafanaApiTokenKey: GRAFANA_API_TOKEN
  # Defaults to GRAFANA_API_TOKEN so existing secrets can back both env names.
  grafanaApiKeyKey: GRAFANA_API_TOKEN
  grafanaPasswordKey: GRAFANA_PASSWORD
  slackBotTokenKey: SLACK_BOT_TOKEN
  slackUserTokenKey: SLACK_USER_TOKEN
  slackNotifyChannelIdKey: SLACK_NOTIFY_CHANNEL_ID
  runnerTokenKey: RUNNER_TOKEN

grafana:
  image: grafana/grafana:11.3.0
  adminUser: admin
  service:
    port: 3000
  storage: 2Gi

prometheus:
  image: prom/prometheus:v2.55.1
  service:
    port: 9090
  storage: 5Gi
  retention: 24h
  scrapeInterval: 15s
  evaluationInterval: 15s

loki:
  image: grafana/loki:3.2.1
  service:
    port: 3100
  storage: 5Gi

alloy:
  image: grafana/alloy:v1.5.1

k6:
  image: grafana/k6:0.54.0
  replicas: 1
  targetUrl: http://checkout-api:8080
  rps: 50
  duration: 24h
  preAllocatedVUs: 80
  maxVUs: 200
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

services:
  checkoutApi:
    image:
      repository: ""
      tag: ""
    replicas: 1
    port: 8080
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  paymentsApi:
    image:
      repository: ""
      tag: ""
    replicas: 1
    port: 8080
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  failureHarness:
    image:
      repository: ""
      tag: ""
    replicas: 1
    port: 8080
    storage: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

agentiumRunner:
  image:
    repository: agentium-runner
    tag: demo
    pullPolicy: IfNotPresent
  deployAgentsImage:
    repository: agentium-runner
    tag: demo
    pullPolicy: IfNotPresent
  mcp:
    grafana:
      enabled: true
      serverId: grafana
      # Pre-baked Grafana MCP Go binary in the runner image; avoids PyPI/network
      # egress at runtime (was `uvx mcp-grafana`, which required DNS the pod
      # didn't have).
      command: /usr/local/bin/mcp-grafana
      args:
        - -t
        - stdio
      env:
        GRAFANA_URL: http://grafana:3000
        GRAFANA_USERNAME: admin
        HOME: /tmp
        XDG_CACHE_HOME: /tmp/.cache
      secretEnvName: GRAFANA_PASSWORD
      # Deprecated alias retained for values files that still set apiKeyEnvName.
      apiKeyEnvName: ""
      importTimeoutSecs: 60
      runtimeCallTimeoutSecs: 120
  replicas: 1
  service:
    name: agentium-runner
    port: 18080
  uiBaseUrl: http://localhost:18080
  webhookPath: /webhooks/grafana
  inotifyMaxUserInstances: 1024
  stateStorage: 1Gi
  repositoryStorage: 1Gi
  runnerToken: demo-runner-token
  rustLog: info
  model: x-ai/grok-4.3
  otel:
    # Disabled by default for demo clusters without an in-cluster OTEL collector.
    # If collector exists, set exporters to `otlp` and endpoint to e.g. http://otel-collector:4317.
    tracesExporter: none
    metricsExporter: none
    protocol: grpc
    endpoint: ""
    serviceName: baml-agent-runner
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
