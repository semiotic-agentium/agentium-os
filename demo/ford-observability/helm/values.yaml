images:
  registry: ghcr.io/semiotic-ai/agent-platform-demo
  tag: latest
  pullPolicy: IfNotPresent

namespaceOverride: ""

secrets:
  openrouterApiKey: ""
  grafanaAdminPassword: "admin"
  slackBotToken: ""
  slackNotifyChannelId: ""

grafana:
  image: grafana/grafana:11.3.0
  adminUser: admin
  service:
    port: 3000
  storage: 2Gi

prometheus:
  image: prom/prometheus:v2.55.1
  service:
    port: 9090
  storage: 5Gi
  retention: 24h
  scrapeInterval: 15s
  evaluationInterval: 15s

loki:
  image: grafana/loki:3.2.1
  service:
    port: 3100
  storage: 5Gi

alloy:
  image: grafana/alloy:v1.5.1

k6:
  image: grafana/k6:0.54.0
  replicas: 1
  targetUrl: http://checkout-api:8080
  rps: 50
  duration: 24h
  preAllocatedVUs: 80
  maxVUs: 200
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

agentiumRunner:
  service:
    name: agentium-runner
    port: 18080
  uiBaseUrl: http://localhost:18080
  webhookPath: /webhooks/grafana
