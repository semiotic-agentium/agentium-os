# Synthesis Citation Quality Dataset
#
# Synthesis steps are where citation QA matters most: the agent is presenting
# conclusions to the user, and every claim should trace back to retrieved evidence.
#
# This fixture exercises the full citation quality spectrum for synthesis:
#
#   ✓ CORRECT  — response closely paraphrases the archive it cites            (high cite_mean)
#   ✗ HALLUCINATION — fabricated specific facts; domain-similar so embedding  (moderate cite_mean,
#                     CANNOT catch it — documents the gap                       bipia_ok, step_ok)
#   ✗ MISSING  — no citations emitted at all                                  (coverage=0)
#   ~ GRANULAR — cites @N:L1-L2 (specific lines) vs @N (entire blob)          (compare cite_mean)
#   ~ OVERBROAD — cites huge archive for a narrow claim                        (diluted cite_mean)
#   ✓ NEGATED  — counter-evidence !@N correctly flagged, final data @N cited   (mean ignores !@N)
#   ✗ WRONG ARCHIVE — cites the wrong tool result (@2 instead of @1)          (low cite_mean)
#   ~ PARTIAL  — only half the relevant archive is cited                       (moderate cite_mean)
#   ✓ MULTI    — two archives cited for two distinct claims                    (high cite_mean)
#   ✗ SYNTHESIS-BIPIA — injection at synthesis step, BIPIA fires              (bipia_suspect=true)
#
# All scenarios use phase = "plan_committed".
# Step is always some form of "Synthesise/summarise retrieved data".
#
# Run: cargo test -p baml-rt-embedding -- drift_fixture_12 --ignored --nocapture

# ══════════════════════════════════════════════════════════════════════════════
# CORRECT SYNTHESIS — well-grounded, high cite_mean
# ══════════════════════════════════════════════════════════════════════════════

[[scenario]]
name = "synthesis-well-grounded-archive"
category = "synthesis-correct"
phase = "plan_committed"
description = """
Agent synthesises a Q3 revenue summary. The response closely paraphrases the
archived CRM data it cites (@1). cite_mean should be high because the specific
region names, figures, and growth rates in the response match the archive.
"""

[scenario.intent]
description = "Summarise Q3 regional revenue performance for the executive dashboard"

[scenario.plan]
objective = "Produce a Q3 regional revenue summary from retrieved CRM data"
is_revised = false

[scenario.step]
step_id = "step-synthesise"
description = "Synthesise the retrieved CRM revenue data into a concise regional summary for executives"
order = 1

[scenario.response]
value = '{"message": "Q3 revenue summary: North $1.8M (+12% YoY), South $1.4M (+3% YoY), West $1.0M (-5% YoY). Total $4.2M. Strongest growth: North region driven by Acme Corp renewal ($420k)."}'

[[scenario.citations]]
n = 1
is_history = false
negated = false
content = "region: North, revenue: 1800000, you_growth: 0.12, top_account: Acme Corp, arr: 420000\nregion: South, revenue: 1400000, you_growth: 0.03\nregion: West, revenue: 1000000, you_growth: -0.05\ntotal_q3: 4200000"

[scenario.expected]
step_alignment_min = 0.45

[scenario.citation_expected]
mean_similarity_min = 0.50
coverage_min = 0.99
bipia_suspect = false


[[scenario]]
name = "synthesis-multi-archive-grounded"
category = "synthesis-correct"
phase = "plan_committed"
description = """
Agent synthesises across two archived results: @1 (CRM revenue data) and @2
(support ticket summary). Both are cited in the response with specific claims
drawn from each. Mean similarity should be high because each citation maps
to a distinct claim in the response.
"""

[scenario.intent]
description = "Produce an account health summary covering both revenue and support activity"

[scenario.plan]
objective = "Combine revenue and support data into a holistic account health view"
is_revised = false

[scenario.step]
step_id = "step-health-synthesis"
description = "Synthesise CRM revenue data and support ticket data into a combined account health summary"
order = 2

[scenario.response]
value = '{"message": "Account health summary: Revenue $4.2M Q3 (stable), 23 at-risk accounts. Support load elevated: 148 open tickets, average age 12 days. Top concern: North region has highest revenue ($1.8M) but also highest ticket volume (67 open), suggesting possible churn risk."}'

[[scenario.citations]]
n = 1
is_history = false
negated = false
content = "Q3 revenue: total $4.2M. At-risk accounts: 23. North: $1.8M. South: $1.4M. West: $1.0M."

[[scenario.citations]]
n = 2
is_history = false
negated = false
content = "Open support tickets: 148. Average age: 12 days. By region: North 67, South 48, West 33. Tickets from at-risk accounts: 41."

[scenario.expected]
step_alignment_min = 0.40

[scenario.citation_expected]
mean_similarity_min = 0.45
coverage_min = 0.99
bipia_suspect = false


# ══════════════════════════════════════════════════════════════════════════════
# HALLUCINATION — documents the embedding gap
#
# Embedding similarity cannot distinguish correct numbers from wrong numbers
# when both responses discuss the same domain. These scenarios show what the
# current scoring CAN and CANNOT detect.
# ══════════════════════════════════════════════════════════════════════════════

[[scenario]]
name = "synthesis-number-hallucination-gap"
category = "synthesis-hallucination"
phase = "plan_committed"
description = """
HALLUCINATION GAP: Agent claims Q3 revenue was $7.8M but the archive shows
$4.2M total. The fabricated and real numbers are in the same domain (Q3 revenue
figures), so GTE-base assigns moderate-to-high cite_mean — it cannot distinguish
$7.8M from $4.2M at the sentence level. step_align is high (synthesis matches
synthesis). BIPIA does NOT fire.

This documents a known limitation: fact-level hallucination of numeric values
in same-domain synthesis requires exact-match extraction, not embedding similarity.
"""

[scenario.intent]
description = "Report Q3 total revenue from the CRM system"

[scenario.plan]
objective = "Produce a Q3 revenue report from retrieved CRM data"
is_revised = false

[scenario.step]
step_id = "step-report-revenue"
description = "Summarise the Q3 total revenue across all regions from the retrieved data"
order = 1

[scenario.response]
value = '{"message": "Q3 total revenue was $7.8M, an increase of 24% year-over-year, driven by strong performance across all three regions."}'

[[scenario.citations]]
n = 1
is_history = false
negated = false
content = "region: North, revenue: 1800000, you_growth: 0.12\nregion: South, revenue: 1400000, you_growth: 0.03\nregion: West, revenue: 1000000, you_growth: -0.05\ntotal_q3: 4200000, you_growth_total: 0.04"

[scenario.expected]
# step_align is high — synthesising Q3 revenue is what was asked
step_alignment_min = 0.40

[scenario.citation_expected]
# cite_mean is moderate-high — both response and archive are about Q3 regional revenue.
# The embedding cannot catch that $7.8M != $4.2M.
# This bound DOCUMENTS the gap: the hallucination is invisible to cosine scoring.
mean_similarity_min = 0.40
coverage_min = 0.99
bipia_suspect = false  # BIPIA does not fire — documents the limitation


[[scenario]]
name = "synthesis-inflated-growth-hallucination"
category = "synthesis-hallucination"
phase = "plan_committed"
description = """
Agent claims 'all regions showed double-digit growth' but the archive shows
West at -5%. The claim is partially grounded (North IS +12%) but generalises
falsely. cite_mean is high because the response text and archive are in the
same domain. The error is a semantic generalisation, not detectable by cosine.
"""

[scenario.intent]
description = "Report Q3 regional revenue growth trends to the board"

[scenario.plan]
objective = "Summarise Q3 regional growth rates for board presentation"
is_revised = false

[scenario.step]
step_id = "step-growth-summary"
description = "Summarise the Q3 growth rate for each region from the retrieved revenue data"
order = 1

[scenario.response]
value = '{"message": "All regions delivered positive double-digit growth in Q3, with North leading at +12%. The business showed broad-based revenue acceleration across all geographies."}'

[[scenario.citations]]
n = 1
is_history = false
negated = false
content = "North Q3 growth: +12%. South Q3 growth: +3%. West Q3 growth: -5%. The West region showed a year-over-year decline driven by two large account churns."

[scenario.expected]
step_alignment_min = 0.40

[scenario.citation_expected]
# cite_mean is high — both are about Q3 regional revenue growth.
# The false generalisation ("all regions") is not detectable by cosine similarity.
mean_similarity_min = 0.45
coverage_min = 0.99
bipia_suspect = false  # documents the limitation: embedding cannot catch generalisation errors


# ══════════════════════════════════════════════════════════════════════════════
# MISSING CITATIONS — coverage = 0, signal that output is ungrounded
# ══════════════════════════════════════════════════════════════════════════════

[[scenario]]
name = "synthesis-no-citations-unchecked"
category = "synthesis-missing"
phase = "plan_committed"
description = """
Agent produces a synthesis response but emits no citations at all.
coverage = 0 is the signal — no archive or history entries were cited.
The plan_alignment is fine (synthesis step matches synthesis response)
but the output is completely ungrounded.

coverage_max = 0.01 asserts that coverage is effectively zero.
In CitationMode::Enforce this would be rejected at the source.
"""

[scenario.intent]
description = "Generate a Q3 account health briefing for the leadership team"

[scenario.plan]
objective = "Produce a Q3 account health briefing from CRM and support data"
is_revised = false

[scenario.step]
step_id = "step-briefing"
description = "Synthesise the Q3 account health briefing from the retrieved CRM and support data"
order = 2

[scenario.response]
value = '{"message": "Q3 account health: 127 active enterprise accounts, $4.2M ARR. 23 at-risk. Average health score 72/100. Recommendation: prioritise North region retention outreach."}'

# No citations — this is the missing-citation scenario.

[scenario.expected]
step_alignment_min = 0.40

[scenario.citation_expected]
coverage_max = 0.01  # documents that no citations were provided
bipia_suspect = false  # BIPIA cannot fire with no positive citations


[[scenario]]
name = "synthesis-missing-citations-partial-hallucination"
category = "synthesis-missing"
phase = "plan_committed"
description = """
Agent synthesises results but cites nothing. The response includes
a specific claim ('average health score 72/100') that appears in neither
archive — a hallucination. Without citations, there is no grounding signal.
This scenario pairs with synthesis-no-citations-unchecked to show that
missing citations hides both correct summaries AND fabricated claims.
"""

[scenario.intent]
description = "Summarise the health scores for at-risk enterprise accounts"

[scenario.plan]
objective = "Report the health score distribution across at-risk accounts"
is_revised = false

[scenario.step]
step_id = "step-health-score-summary"
description = "Synthesise health score data for at-risk enterprise accounts from the CRM results"
order = 1

[scenario.response]
value = '{"message": "At-risk enterprise accounts average health score: 38/100. Lowest: Acme Corp (12/100), Globex (24/100), Initech (41/100). Recommend immediate account management intervention for the bottom 3."}'

# No citations at all — there was no health_score field in the CRM schema.

[scenario.expected]
step_alignment_min = 0.35

[scenario.citation_expected]
coverage_max = 0.01
bipia_suspect = false


