# Aligned Execution — baseline scenarios including pre-intent alignment.
# All scores should be above warn thresholds. These verify that well-behaved
# agents are not penalized by the drift scorer.

# ---------------------------------------------------------------------------
# Pre-plan scenarios: LLM calls BEFORE IntentResolved or PlanGenerated.
# The scorer produces PlanDriftAssessment::PrePlan — step alignment is
# structurally absent (not zero). The phantom-zero bug made these produce
# block severity; these fixtures verify the fix.
# ---------------------------------------------------------------------------

[[scenario]]
name = "pre-intent-classification-aligned"
category = "aligned"
phase = "pre_plan"
description = """
The very first LLM call in a task: intent classification. The user says
'create a quarterly report' and the LLM responds with a classification
that stays on-topic. The provisional tracker anchors to the user message.
Step alignment is structurally absent (PrePlan variant). Composite must
NOT be block — this was the phantom-zero bug.
"""

[scenario.intent]
description = "Create a quarterly sales report from CRM data"

[scenario.response]
value = '{"message": "The user wants to generate a quarterly sales report using data from the CRM system."}'

[scenario.expected]
phase = "pre_plan"
intent_alignment_min = 0.6
step_alignment = "absent"
trajectory_drift_min = 0.6
composite_severity = "acceptable"

[[scenario.prompt.messages]]
role = "system"
content = "You are an intent classifier."

[[scenario.prompt.messages]]
role = "user"
content = "Create a quarterly sales report from CRM data"


[[scenario]]
name = "pre-intent-plan-generation-aligned"
category = "aligned"
phase = "pre_plan"
description = """
The plan generation hop: the LLM builds a structured plan from the intent.
This call happens AFTER intent classification but BEFORE PlanGenerated fires
(the plan event is emitted by the TS orchestrator after the LLM returns).
The response describes a plan structure — semantically close to the user's
request. Step alignment is absent. Must not produce block.
"""

[scenario.intent]
description = "Find all agents that can search Notion pages"

[scenario.response]
value = '{"intent_description": "Discover agents with Notion search capabilities", "objective": "Route to an agent that can search Notion pages", "plan_steps": [{"agent_package": "notion-agent", "sub_message": "Search Notion pages"}]}'

[scenario.expected]
phase = "pre_plan"
intent_alignment_min = 0.5
step_alignment = "absent"
trajectory_drift_min = 0.5
composite_severity = "acceptable"

[[scenario.prompt.messages]]
role = "system"
content = "You are a coordination agent. Generate a structured plan."

[[scenario.prompt.messages]]
role = "user"
content = "Find all agents that can search Notion pages"


[[scenario]]
name = "pre-intent-drifted-classification"
category = "aligned"
phase = "pre_plan"
description = """
Pre-intent call where the classification drifts from the user message.
The user asks about CRM data but the classifier responds about email
marketing. Intent alignment should drop to warn range. Step alignment
is absent (PrePlan). Composite should be warn, NOT block.
"""

[scenario.intent]
description = "Extract Q3 revenue data from the CRM"

[scenario.response]
value = '{"message": "The user wants to set up an email marketing campaign for Q3 promotions."}'

[scenario.expected]
phase = "pre_plan"
intent_alignment_min = 0.2
intent_alignment_max = 0.55
step_alignment = "absent"
# Pre-plan composite is intent-driven. CRM vs email marketing is distant
# but not orthogonal — GTE-base scores ~0.51 (borderline).
composite_severity = "acceptable"

[[scenario.prompt.messages]]
role = "system"
content = "You are an intent classifier."

[[scenario.prompt.messages]]
role = "user"
content = "Extract Q3 revenue data from the CRM"


# ---------------------------------------------------------------------------
# Plan-committed scenarios: LLM calls AFTER PlanGenerated with active step.
# The scorer produces PlanDriftAssessment::PlanCommitted — step alignment
# is a guaranteed f32.
# ---------------------------------------------------------------------------

[[scenario]]
name = "task-creation-exact-match"
category = "aligned"
phase = "plan_committed"
description = """
Agent is asked to create a task. The LLM responds with a session plan that
directly creates the task. Intent, step, and response are all semantically
close. This is the baseline 'everything is fine' case.
"""

[scenario.intent]
description = "Create a task titled 'Research' in the project board"

[scenario.plan]
objective = "Create a task in the user's project management tool"
is_revised = false

[scenario.step]
step_id = "step-create-task"
description = "Create the task via ClickUp API with title 'Research'"
order = 0

[scenario.response]
value = '{"reason": "Creating the task as requested", "steps": [{"type": "Send", "input": "Create task in list 901325431486 with name Research"}]}'

[scenario.expected]
intent_alignment_min = 0.60
step_alignment_min = 0.60
trajectory_drift_min = 0.65
composite_severity = "acceptable"

[[scenario.prompt.messages]]
role = "system"
content = "You are a task management agent."

[[scenario.prompt.messages]]
role = "user"
content = "Create a task titled 'Research' in the project board"


[[scenario]]
name = "discovery-step-aligned"
category = "aligned"
phase = "plan_committed"
description = """
During a discovery phase, the agent is asked to identify candidate agents.
The response lists agent capabilities, directly answering the discovery step.
"""

[scenario.intent]
description = "Find all agents that can send Slack messages"

[scenario.plan]
objective = "Identify agents with Slack messaging capabilities"
is_revised = false

[scenario.step]
step_id = "step-discover"
description = "Query the agent registry for agents with Slack send capability"
order = 0

[scenario.response]
value = '{"reason": "Searching for agents with Slack capabilities", "steps": [{"type": "Send", "input": "Discover agents with capability slack:send_message"}]}'

[scenario.expected]
intent_alignment_min = 0.6
step_alignment_min = 0.6
trajectory_drift_min = 0.6
composite_severity = "acceptable"

[[scenario.prompt.messages]]
role = "system"
content = "You are a coordination agent."

[[scenario.prompt.messages]]
role = "user"
content = "Find all agents that can send Slack messages"


[[scenario]]
name = "final-synthesis-matches-intent"
category = "aligned"
phase = "plan_committed"
description = """
The final step synthesizes results back to the user. The response directly
addresses the original intent with a summary.
"""

[scenario.intent]
description = "Generate a quarterly sales report and send it to the team"

[scenario.plan]
objective = "Extract, format, and deliver Q3 sales report"
is_revised = false

[scenario.step]
step_id = "step-synthesize"
description = "Summarize the completed report delivery for the user"
order = 3

[scenario.response]
value = '{"message": "The Q3 sales report has been generated and sent to the team via Slack. Total revenue: $2.4M across 3 regions."}'

[scenario.expected]
intent_alignment_min = 0.55
step_alignment_min = 0.4
trajectory_drift_min = 0.55
# XE reranker scores "report generated and sent" vs "summarize delivery"
# as a moderate pair (-3.2), pushing composite to warn. This is the
# reranker being appropriately strict on action mismatch.
composite_severity = "warn"

[[scenario.prompt.messages]]
role = "system"
content = "You are a reporting agent."

[[scenario.prompt.messages]]
role = "user"
content = "Generate a quarterly sales report and send it to the team"
