# Nextest config for BAML runtime workspace.
# See https://nexte.st/docs/configuration/

experimental = ["setup-scripts"]

# Regenerate fixture TypeScript type declarations once before tests start.
# Runs for both default and ci profiles (ci inherits from default).
[scripts.setup.regen-fixtures]
command = 'cargo run -p baml-rt-builder --features http-tools,memory --bin regen_fixtures'
slow-timeout = { period = "120s", terminate-after = 2 }

[[profile.default.scripts]]
filter = 'all()'
setup = 'regen-fixtures'

[profile.ci]
# Do not stop scheduling on first failure; surface full suite results in CI.
fail-fast = false
# JUnit output for GitHub Actions junit-report-action.
[profile.ci.junit]
path = "junit.xml"
store-failure-output = true

# Rate-limit provenance/heavy tests (max 1 at a time) to avoid resource contention.
# LLM e2e tests hit external APIs with variable latency; cap concurrency to reduce
# scheduler pressure and timeout flakes on resource-constrained CI runners.
[test-groups]
llm = { max-threads = 4 }
provenance = { max-threads = 1 }

[[profile.ci.overrides]]
filter = 'package(baml-rt-provenance) and (binary(graphqlite_store_test) or binary(tool_index_test))'
test-group = "provenance"

[[profile.ci.overrides]]
filter = 'package(baml-rt-a2a) and (binary(provenance_context_test) or binary(provenance_property_test))'
test-group = "provenance"

# E2E: build fixture (OXC + BAML + tar) + agent setup; allow long run.
[[profile.ci.overrides]]
filter = 'package(baml-agent-runner) and test(~conversational_context_auto_via_provenance)'
test-group = "provenance"
slow-timeout = { period = "120s", terminate-after = 10 }

# `test_e2e_stream_baml_tool` has shown rare process-level SIGBUS flakes in CI.
# Retry this specific test to absorb transient runtime crashes while preserving
# failure visibility if the issue is persistent.
[[profile.ci.overrides]]
filter = 'package(baml-agent-runner) and test(~test_e2e_stream_baml_tool)'
retries = { backoff = "fixed", count = 2, delay = "2s" }

# LLM-dependent e2e tests: throttle concurrency and allow generous timeouts.
# These hit external LLM APIs (OpenRouter) whose latency varies wildly on CI.
[[profile.ci.overrides]]
filter = 'package(baml-agent-runner) and test(~test_e2e_)'
test-group = "llm"
slow-timeout = { period = "120s", terminate-after = 2 }
retries = { backoff = "fixed", count = 1, delay = "5s" }

# LLM two-agent argument sketch test needs extra time on shared CI runners.
[[profile.ci.overrides]]
filter = 'package(baml-agent-runner) and test(~test_e2e_argument_sketch_two_agents)'
slow-timeout = { period = "300s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = 'package(baml-rt-interceptor) and test(~test_e2e_)'
test-group = "llm"
retries = { backoff = "fixed", count = 1, delay = "2s" }

# baml-rt-a2a streaming tests: timing-sensitive, flake under CI resource contention.
[[profile.ci.overrides]]
filter = 'package(baml-rt-a2a) and binary(task_streaming_test)'
test-group = "llm"
slow-timeout = { period = "60s", terminate-after = 2 }
retries = { backoff = "fixed", count = 1, delay = "3s" }
