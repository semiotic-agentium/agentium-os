# Nextest config for BAML runtime workspace.
# See https://nexte.st/docs/configuration/
#
# Generated fixture/agent files (`_baml_runtime.baml`, `baml-runtime.d.ts`) are
# committed; refresh with `just regen-fixtures`. Pre-commit runs regen when
# relevant paths are staged (see `.pre-commit-config.yaml`).

[profile.ci]
fail-fast = false
[profile.ci.junit]
path = "junit.xml"
store-failure-output = true

# Rate-limit provenance tests (max 1 at a time) to avoid SurrealDB embedded
# resource contention.
[test-groups]
provenance = { max-threads = 1 }
runner-subprocess = { max-threads = 1 }
workflow-intake-e2e = { max-threads = 1 }
semantic-ingress-e2e = { max-threads = 1 }
llm-heavy = { max-threads = 1 }

[[profile.ci.overrides]]
filter = 'package(baml-rt-provenance) and binary(tool_index_test)'
test-group = "provenance"

[[profile.ci.overrides]]
filter = 'package(baml-rt-a2a) and (binary(provenance_context_test) or binary(provenance_property_test))'
test-group = "provenance"

[[profile.ci.overrides]]
filter = 'package(baml-rt-api)'
test-group = "provenance"

[[profile.ci.overrides]]
filter = 'package(baml-tools-system)'
test-group = "provenance"

# E2E: build fixture + agent setup; allow long run.
[[profile.ci.overrides]]
filter = 'package(baml-agent-runner) and test(~conversational_context_auto_via_provenance)'
test-group = "provenance"
slow-timeout = { period = "120s", terminate-after = 10 }

# QuickJS C engine shows rare SIGBUS/SIGSEGV flakes in CI. Retry.
[[profile.ci.overrides]]
filter = 'package(baml-agent-runner) and test(~test_e2e_stream_baml_tool)'
retries = { backoff = "fixed", count = 2, delay = "2s" }

[[profile.ci.overrides]]
filter = 'package(baml-agent-runner) and test(~test_internal_a2a_)'
retries = { backoff = "fixed", count = 2, delay = "2s" }

# A2A interleaving property tests: timing-sensitive under CI resource contention.
[[profile.ci.overrides]]
filter = 'package(baml-rt-a2a) and (test(~test_interleaved) or test(~interleaved))'
retries = { backoff = "fixed", count = 2, delay = "2s" }

# LLM-dependent e2e tests: generous timeouts and retries.
[[profile.ci.overrides]]
filter = 'package(baml-agent-runner) and test(~test_e2e_)'
slow-timeout = { period = "120s", terminate-after = 2 }
retries = { backoff = "fixed", count = 1, delay = "5s" }

# Notion direct-id e2e: extra retries (LLM plan extraction occasionally skips tool path).
[[profile.ci.overrides]]
filter = 'package(baml-agent-runner) and test(~test_e2e_notion_direct_id_path)'
slow-timeout = { period = "120s", terminate-after = 2 }
retries = { backoff = "fixed", count = 3, delay = "8s" }

[[profile.ci.overrides]]
filter = 'package(baml-rt-interceptor) and test(~test_e2e_)'
retries = { backoff = "fixed", count = 1, delay = "2s" }

# baml-rt llm_test: real LLM calls (SimpleGreeting + streaming).
[[profile.ci.overrides]]
filter = 'package(baml-rt) and binary(llm_test)'
slow-timeout = { period = "120s", terminate-after = 2 }
retries = { backoff = "fixed", count = 1, delay = "5s" }

[[profile.ci.overrides]]
filter = 'package(baml-rt-a2a) and binary(task_streaming_test)'
slow-timeout = { period = "60s", terminate-after = 2 }
retries = { backoff = "fixed", count = 1, delay = "3s" }

# Workflow intake tests spawn subprocesses with HTTP servers; flaky under load.
[[profile.ci.overrides]]
filter = 'package(baml-agent-runner) and binary(runner_workflow_intake_test)'
test-group = "workflow-intake-e2e"
slow-timeout = { period = "120s", terminate-after = 2 }
retries = { backoff = "fixed", count = 2, delay = "3s" }

[[profile.ci.overrides]]
filter = 'package(baml-agent-runner) and binary(runner_semantic_ingress_test)'
test-group = "semantic-ingress-e2e"
slow-timeout = { period = "120s", terminate-after = 2 }
retries = { backoff = "fixed", count = 2, delay = "3s" }

[[profile.ci.overrides]]
filter = 'package(baml-agent-runner) and binary(runner_callback_test)'
test-group = "runner-subprocess"

[[profile.ci.overrides]]
filter = 'package(baml-agent-runner) and binary(runner_cluster_test)'
test-group = "runner-subprocess"

# A2A provenance-using test binaries: route to provenance group.
[[profile.ci.overrides]]
filter = 'package(baml-rt-a2a) and (binary(run_handle_a2a_property_test) or binary(a2a_malformed_and_error_paths_test))'
test-group = "provenance"
slow-timeout = { period = "60s", terminate-after = 2 }
retries = { backoff = "fixed", count = 2, delay = "2s" }

# A2A property test drives many concurrent INPUT_REQUIRED/resume cycles.
[[profile.ci.overrides]]
filter = 'package(baml-rt-a2a) and test(prop_input_required_resume_positive_and_no_auto_final)'
slow-timeout = { period = "300s", terminate-after = 1 }

# Multi-context interleaving property test: worst-case 7 ops × 6s × CI-scale-3 = 162s.
# No retries: retrying a timed-out property test never shrinks the case.
[[profile.ci.overrides]]
filter = 'package(baml-rt-a2a) and test(prop_interleaved_a2a_tool_llm_multi_context_isolation)'
slow-timeout = { period = "300s", terminate-after = 1 }
retries = 0

# =============================================================================
# Profile: ci-merged
# Single workspace pass that covers both LLM-gated and non-LLM tests.
# Compile with the union feature set (`...,llm-tests`) so all tests are present
# in one artifact graph.
# =============================================================================
[profile.ci-merged]
fail-fast = false
[profile.ci-merged.junit]
path = "junit.xml"
store-failure-output = true

# Full runner subprocess tests need real cross-process serialization under nextest.
[[profile.ci-merged.overrides]]
filter = 'package(baml-agent-runner) and binary(runner_callback_test)'
test-group = "runner-subprocess"

[[profile.ci-merged.overrides]]
filter = 'package(baml-agent-runner) and binary(runner_cluster_test)'
test-group = "runner-subprocess"

# Workflow intake tests spawn subprocesses with HTTP servers; flaky under load.
[[profile.ci-merged.overrides]]
filter = 'package(baml-agent-runner) and binary(runner_workflow_intake_test)'
test-group = "workflow-intake-e2e"
slow-timeout = { period = "120s", terminate-after = 2 }
retries = { backoff = "fixed", count = 2, delay = "3s" }

[[profile.ci-merged.overrides]]
filter = 'package(baml-agent-runner) and binary(runner_semantic_ingress_test)'
test-group = "semantic-ingress-e2e"
slow-timeout = { period = "120s", terminate-after = 2 }
retries = { backoff = "fixed", count = 2, delay = "3s" }

# Security-eval + LLM drift integration is timing/network heavy; serialize this binary.
[[profile.ci-merged.overrides]]
filter = 'package(baml-agent-runner) and binary(drift_integration_test)'
test-group = "llm-heavy"

# Two-agent real-LLM handoff test is especially timing/resource sensitive in CI.
[[profile.ci-merged.overrides]]
filter = 'package(baml-agent-runner) and test(test_e2e_argument_sketch_two_agents)'
test-group = "llm-heavy"
slow-timeout = { period = "300s", terminate-after = 2 }
retries = { backoff = "fixed", count = 2, delay = "5s" }

# Provenance tests need serialization to avoid SurrealDB contention.
[[profile.ci-merged.overrides]]
filter = 'package(baml-rt-provenance) and binary(tool_index_test)'
test-group = "provenance"

[[profile.ci-merged.overrides]]
filter = 'package(baml-rt-a2a) and (binary(provenance_context_test) or binary(provenance_property_test))'
test-group = "provenance"

[[profile.ci-merged.overrides]]
filter = 'package(baml-rt-api)'
test-group = "provenance"

[[profile.ci-merged.overrides]]
filter = 'package(baml-tools-system)'
test-group = "provenance"

[[profile.ci-merged.overrides]]
filter = 'package(baml-agent-runner) and test(~conversational_context_auto_via_provenance)'
test-group = "provenance"
slow-timeout = { period = "120s", terminate-after = 10 }

# QuickJS C engine shows rare SIGBUS/SIGSEGV flakes in CI. Retry.
[[profile.ci-merged.overrides]]
filter = 'package(baml-agent-runner) and test(~test_e2e_stream_baml_tool)'
retries = { backoff = "fixed", count = 2, delay = "2s" }

[[profile.ci-merged.overrides]]
filter = 'package(baml-agent-runner) and test(~test_internal_a2a_)'
retries = { backoff = "fixed", count = 2, delay = "2s" }

# Multi-context interleaving property test: worst-case 7 ops × 6s × CI-scale-3 = 162s.
# No retries: retrying a timed-out property test never shrinks the case.
# Must precede the broader `test(~interleaved)` override below — nextest applies the
# first matching override per setting, and the test name contains "interleaved".
[[profile.ci-merged.overrides]]
filter = 'package(baml-rt-a2a) and test(prop_interleaved_a2a_tool_llm_multi_context_isolation)'
slow-timeout = { period = "300s", terminate-after = 1 }
retries = 0

[[profile.ci-merged.overrides]]
filter = 'package(baml-rt-a2a) and (test(~test_interleaved) or test(~interleaved))'
retries = { backoff = "fixed", count = 2, delay = "2s" }

[[profile.ci-merged.overrides]]
filter = 'package(baml-rt-a2a) and (binary(run_handle_a2a_property_test) or binary(a2a_malformed_and_error_paths_test))'
test-group = "provenance"
slow-timeout = { period = "60s", terminate-after = 2 }
retries = { backoff = "fixed", count = 2, delay = "2s" }

[[profile.ci-merged.overrides]]
filter = 'package(baml-rt-a2a) and test(prop_input_required_resume_positive_and_no_auto_final)'
slow-timeout = { period = "300s", terminate-after = 1 }

# Concurrent stream phase matrix: timing-sensitive under CI load; increase timeout and add retries.
[[profile.ci-merged.overrides]]
filter = 'package(baml-rt-a2a) and test(concurrent_stream_phase_matrix_regression_under_load)'
slow-timeout = { period = "30s", terminate-after = 2 }
retries = { backoff = "fixed", count = 2, delay = "2s" }

# Notion direct-id e2e: extra retries (LLM plan extraction occasionally skips tool path).
[[profile.ci-merged.overrides]]
filter = 'package(baml-agent-runner) and test(~test_e2e_notion_direct_id_path)'
retries = { backoff = "fixed", count = 3, delay = "8s" }

# Default timeouts and retries. Earlier overrides take priority per nextest semantics,
# so this catch-all applies only where no specific override has set the corresponding field.
[[profile.ci-merged.overrides]]
filter = 'all()'
slow-timeout = { period = "120s", terminate-after = 2 }
retries = { backoff = "fixed", count = 1, delay = "5s" }
