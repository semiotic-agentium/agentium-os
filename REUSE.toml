version = 1

# Licensing metadata for files that do not carry an inline SPDX header.
#
# Hand-edited first-party source (crates/**/*.rs, web/src/**, scripts/**,
# example tool sources) carries a two-line SPDX header instead and is NOT
# listed here, so `reuse lint` still fails on a new source file that ships
# without one — that is the point of the CI gate.
#
# Covered below: configuration, documentation, generated trees, content-hashed
# agent/fixture bundles, snapshots, and vendored binary assets.

# --- Configuration, docs, data, and other non-headered first-party files ---
[[annotations]]
path = [
  "**/*.json",
  "**/*.toml",
  "**/*.yaml",
  "**/*.yml",
  "**/*.md",
  "**/*.txt",
  "**/*.html",
  "**/*.css",
  "**/*.js",
  "**/*.lock",
  "**/*.nix",
  "**/*.example",
  "**/*.tmpl",
  "**/*.tpl",
  "**/*.manifest",
  "**/*.snap",
  "**/*.proptest-regressions",
  "**/.gitignore",
  "**/.gitattributes",
  "**/.dockerignore",
  "**/.prettierrc",
  "**/*.template",
  "**/Dockerfile",
  "justfile",
  "LICENSE",
  "NOTICE",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Semiotic AI, Inc."
SPDX-License-Identifier = "Apache-2.0"

# --- Generated and content-hashed trees ---
# BAML schemas and generated runtime types, ts-rs bindings, built agent
# packages, fixture and example agent bundles. These are regenerated by the
# build pipeline or hashed by tests, so inline headers are not applied.
[[annotations]]
path = [
  "**/*.baml",
  "crates/**/bindings/**",
  "agents/**",
  "tests/**",
  "examples/**",
  ".cursor/**",
  ".verify-stack/**",
  "video/**",
  "schemas/**",
  "observability/**",
  "deploy/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Semiotic AI, Inc."
SPDX-License-Identifier = "Apache-2.0"

# --- Vendored third-party model snapshots (HuggingFace cache layout) ---
# Embedding/reranker models cached for offline use. Upstream-licensed under
# Apache-2.0; copyright remains with the model authors, not Semiotic AI.
[[annotations]]
path = "models/fastembed/models--Alibaba-NLP--gte-base-en-v1.5/**"
precedence = "override"
SPDX-FileCopyrightText = "The gte-base-en-v1.5 authors (Alibaba-NLP)"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "models/fastembed/models--jinaai--jina-reranker-v1-turbo-en/**"
precedence = "override"
SPDX-FileCopyrightText = "Jina AI GmbH (jina-reranker-v1-turbo-en authors)"
SPDX-License-Identifier = "Apache-2.0"
