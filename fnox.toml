# fnox secret store — local development template
#
# FnoxFileSecretResolver loads this file at startup and caches resolved values.
# Add your secrets here for local development. Do NOT commit real values.
#
# In CI, this file is overwritten by the "Write fnox secrets" workflow step
# which generates it with explicit `default` values from CI secret variables.
#
# Local dev: set `default = "your-actual-key"` for each secret you need,
# or configure a [providers] block (1Password, AWS KMS, etc.) for team secrets.

[secrets.OPENROUTER_API_KEY]
description = "OpenRouter API key — LLM backend for all agents"
if_missing = "warn"
# default = "sk-or-v1-..."

# Test-model knob: BAML files reference this as `env.BAML_TEST_MODEL` and the
# Rust `test_model_default()` helper reads it from OS env.
# CI overwrites this file with the value of the `BAML_TEST_MODEL` repo variable
# (workflow env). Locally, edit `default` to pin a different model — model ids
# are not secrets, so committing the fallback here is intentional. The current
# fallback is the model the agent prompts and E2E tests are tuned against;
# operators running under an OpenRouter account whose policy excludes grok
# should set the `BAML_TEST_MODEL` repo variable. See issue #429.
[secrets.BAML_TEST_MODEL]
description = "Model id used by the workspace's llm-tests lane (BAML env.BAML_TEST_MODEL)"
if_missing = "warn"
default = "x-ai/grok-4.3"

# Optional integration secrets: `ignore` avoids stderr noise when running workspace tests or
# agents that do not register those tools. Use `default = "..."` locally when you need the tool.
[secrets.CLICKUP_API_KEY]
description = "ClickUp personal API token (pk_...) — support/clickup tool; also used by integrations-clickup-client (env first, then this store)"
if_missing = "ignore"
# default = "pk_..."  # uncomment for local clickup-agent E2E / task-daemon without exporting env

[secrets.NOTION_API_TOKEN]
description = "Notion integration token — support/notion* tools"
if_missing = "ignore"
# default = "secret_..."

[secrets.SLACK_BOT_TOKEN]
description = "Slack bot token (xoxb-...) — support/slack tool, bot-scoped reads"
if_missing = "ignore"
# default = "xoxb-..."

[secrets.SLACK_USER_TOKEN]
description = "Slack user token (xoxp-...) — support/slack tool, user-scoped search"
if_missing = "ignore"
# default = "xoxp-..."
