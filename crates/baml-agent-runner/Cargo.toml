[package]
name = "baml-agent-runner"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
publish = false
license = "MIT"

[dependencies]
baml-rt-a2a = { path = "../baml-rt-a2a" }
baml-rt-api = { path = "../baml-rt-api" }
baml-rt-core = { path = "../baml-rt-core" }
baml-rt-router = { path = "../baml-rt-router" }
baml-rt-observability = { path = "../baml-rt-observability" }
baml-rt-quickjs = { path = "../baml-rt-quickjs" }
baml-rt-llm-config = { path = "../baml-rt-llm-config" }
baml-rt-config = { path = "../baml-rt-config" }
baml-rt-provenance = { path = "../baml-rt-provenance" }
baml-rt-repository = { path = "../baml-rt-repository" }
baml-rt-embedding = { path = "../baml-rt-embedding" }
baml-rt-tools = { path = "../baml-rt-tools", default-features = false }
baml-rt-tools-claude = { path = "../tools/claude" }
baml-rt-mcp = { path = "../baml-rt-mcp" }
baml-tools-system = { path = "../tools/system" }
baml-tools-calculator = { path = "../tools/calculator", optional = true }
baml-tools-clickup = { path = "../tools/clickup", optional = true }
baml-tools-github = { path = "../tools/github", optional = true }
baml-tools-memory = { path = "../tools/memory", optional = true }
baml-tools-notion = { path = "../tools/notion", optional = true }
baml-tools-slack = { path = "../tools/slack", optional = true }
baml-tools-slack-notify = { path = "../tools/slack-notify", optional = true }
baml-tools-grafana-alerts = { path = "../tools/grafana-alerts", optional = true }
baml-tools-security-eval = { path = "../tools/security-eval", optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
surrealdb = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
toml = "0.8"
url = { workspace = true }

[dev-dependencies]
baml-rt-conversation = { path = "../baml-rt-conversation" }
baml-rt-repository = { path = "../baml-rt-repository" }
test-support = { path = "../test-support", features = ["slack"] }
baml-rt = { path = "../baml-rt" }
baml-derive = { path = "../baml-derive" }
baml-derive-core = { path = "../baml-derive-core" }
baml-tools-slack = { path = "../tools/slack" }
baml-rt-tools = { path = "../baml-rt-tools", features = ["test-support"] }
async-trait = { workspace = true }
dotenvy = { workspace = true }
serde = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
testcontainers-modules = { workspace = true }

[features]
default = []
# Each forwards into baml-rt-api (which force-links the crate for repository-side
# builds and forwards on to baml-rt-builder), in addition to the runner's own
# direct force-link in main.rs. Without the api forward, a runner built with a
# tool feature would still get a slim api and lose that tool at publish time.
clickup = ["dep:baml-tools-clickup", "baml-rt-api/clickup"]
github = ["dep:baml-tools-github", "baml-rt-api/github"]
memory = ["dep:baml-tools-memory", "baml-rt-api/memory"]
notion = ["dep:baml-tools-notion", "baml-rt-api/notion"]
slack = ["dep:baml-tools-slack", "baml-rt-api/slack"]
slack-notify = ["dep:baml-tools-slack-notify", "baml-rt-api/slack-notify"]
grafana-alerts = ["dep:baml-tools-grafana-alerts", "baml-rt-api/grafana-alerts"]
security-eval = ["dep:baml-tools-security-eval", "baml-rt-api/security-eval"]
http-tools = ["clickup", "github", "notion", "slack", "slack-notify", "security-eval", "grafana-alerts"]
# Demo/testing-only tools (e.g. the arithmetic `support/calculate`). Off by
# default so a shipped runner does not expose them; enabled by `--all-features`
# dev/CI builds and by `regen-fixtures`. NOT part of `http-tools`.
dev-tools = ["dep:baml-tools-calculator"]
# Compile-time sandbox provider selection (three states):
#   feature ON              → MicrosandboxProvider (production)
#   feature OFF + cfg(test) → MockSandboxProvider::echo() (tests)
#   feature OFF + no test   → None (no sandbox)
sandbox-provider = ["baml-rt-tools/sandbox-provider"]
llm-tests = []
cluster-tests = []
