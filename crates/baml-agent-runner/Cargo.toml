[package]
name = "baml-agent-runner"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
publish = false
license = "MIT"

[dependencies]
baml-rt-a2a = { path = "../baml-rt-a2a" }
baml-rt-api = { path = "../baml-rt-api" }
baml-rt-core = { path = "../baml-rt-core" }
baml-rt-observability = { path = "../baml-rt-observability" }
baml-rt-quickjs = { path = "../baml-rt-quickjs" }
baml-rt-provenance = { path = "../baml-rt-provenance" }
baml-rt-tools = { path = "../baml-rt-tools", default-features = false }
anyhow = { workspace = true }
async-trait = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
uuid = { workspace = true }
testcontainers = { workspace = true, optional = true }
text-to-cypher = { workspace = true, optional = true, default-features = false }

[dev-dependencies]
test-support = { path = "../test-support" }
baml-rt = { path = "../baml-rt" }
async-trait = { workspace = true }
dotenvy = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
ts-rs = { workspace = true }

[features]
default = []
clickup = ["baml-rt-tools/clickup"]
notion = ["baml-rt-tools/notion"]
http-tools = ["clickup", "notion"]
falkordb-tests = ["dep:testcontainers", "dep:text-to-cypher", "test-support/falkordb-tests"]
