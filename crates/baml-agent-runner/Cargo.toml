[package]
name = "baml-agent-runner"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
publish = false
license = "MIT"

[dependencies]
baml-rt-a2a = { path = "../baml-rt-a2a" }
baml-rt-api = { path = "../baml-rt-api" }
baml-rt-core = { path = "../baml-rt-core" }
baml-rt-observability = { path = "../baml-rt-observability" }
baml-rt-quickjs = { path = "../baml-rt-quickjs" }
baml-rt-llm-config = { path = "../baml-rt-llm-config" }
baml-rt-config = { path = "../baml-rt-config" }
baml-rt-provenance = { path = "../baml-rt-provenance" }
baml-rt-tools = { path = "../baml-rt-tools", default-features = false }
# Direct dependencies for types used in code (not just force-linking)
baml-rt-tools-claude = { path = "../tools/claude" }
baml-tools-system = { path = "../tools/system" }
# Centralized force-link crate - features forward tool dependencies
baml-tool-links = { path = "../baml-tool-links" }
anyhow = { workspace = true }
async-trait = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
test-support = { path = "../test-support" }
baml-rt = { path = "../baml-rt" }
async-trait = { workspace = true }
dotenvy = { workspace = true }
futures-util = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
ts-rs = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
insta = { workspace = true }

[features]
default = []
# Tool features forward to baml-tool-links
clickup = ["baml-tool-links/clickup"]
internal-dev = ["baml-tool-links/internal-dev"]
memory = ["baml-tool-links/memory"]
notion = ["baml-tool-links/notion"]
slack = ["baml-tool-links/slack"]
http-tools = ["baml-tool-links/http-tools"]
llm-tests = []
