[package]
name = "baml-rt-builder"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
publish = false

[[bin]]
name = "baml-agent-builder"
path = "src/baml-agent-builder.rs"

[dependencies]
baml-rt-core = { path = "../baml-rt-core" }
baml-rt-observability = { path = "../baml-rt-observability" }
baml-rt-quickjs = { path = "../baml-rt-quickjs" }
baml-rt-tools = { path = "../baml-rt-tools", default-features = false }
# Centralized force-link crate - features forward tool dependencies
baml-tool-links = { path = "../baml-tool-links" }
baml-runtime = { workspace = true }
baml-types = { workspace = true }
internal-baml-core = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
inquire = "0.9"
tokio = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
genco = "0.19.0"
dotenvy = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
test-support = { path = "../test-support" }
baml-rt = { path = "../baml-rt" }
insta = { workspace = true }

[features]
default = []
# Tool features forward to baml-tool-links
clickup = ["baml-tool-links/clickup"]
internal-dev = ["baml-tool-links/internal-dev"]
memory = ["baml-tool-links/memory"]
notion = ["baml-tool-links/notion"]
slack = ["baml-tool-links/slack"]
http-tools = ["baml-tool-links/http-tools"]
