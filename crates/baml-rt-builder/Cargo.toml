[package]
name = "baml-rt-builder"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
publish = false

[[bin]]
name = "baml-agent-builder"
path = "src/baml-agent-builder.rs"

[dependencies]
baml-rt-core = { path = "../baml-rt-core" }
baml-rt-observability = { path = "../baml-rt-observability" }
baml-rt-quickjs = { path = "../baml-rt-quickjs" }
baml-rt-tools = { path = "../baml-rt-tools", default-features = false }
baml-rt-tools-system = { path = "../tools/system" }
baml-runtime = { workspace = true }
baml-types = { workspace = true }
internal-baml-core = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
oxc_parser = { workspace = true }
oxc_allocator = { workspace = true }
oxc_span = { workspace = true }
oxc_codegen = { workspace = true }
oxc_transformer = { workspace = true }
oxc_semantic = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
inquire = "0.9"
tokio = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
genco = "0.19.0"
dotenvy = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
test-support = { path = "../test-support" }
baml-rt = { path = "../baml-rt" }
insta = { workspace = true }

[features]
default = []
clickup = ["baml-rt-tools/clickup"]
notion = ["baml-rt-tools/notion"]
http-tools = ["clickup", "notion"]
