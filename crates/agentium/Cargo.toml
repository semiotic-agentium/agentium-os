[package]
name = "agentium"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
publish = false
description = "Agentium — unified platform host and developer SDK"

[[bin]]
name = "agentium"
path = "src/main.rs"

[dependencies]
baml-agent-runner = { path = "../baml-agent-runner", features = ["http-tools", "memory", "sandbox-provider", "dev-tools"] }
baml-rt-core = { path = "../baml-rt-core" }
baml-rt-tools = { path = "../baml-rt-tools", default-features = false }
baml-rt-repository = { path = "../baml-rt-repository" }
baml-rt-builder = { path = "../baml-rt-builder" }
baml-rt-api = { path = "../baml-rt-api" }
baml-rt-provenance = { path = "../baml-rt-provenance" }
baml-rt-llm-config = { path = "../baml-rt-llm-config" }
clap = { workspace = true }
toml = "0.8"
toml_edit = "0.22"
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
reqwest-eventsource = "0.6"
futures-util = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
console = "0.15"
indicatif = "0.17"
inquire = "0.7"
tokio = { workspace = true }
tempfile = { workspace = true }
dirs = "6"

[features]
default = ["http-tools", "memory", "sandbox-provider", "dev-tools"]
http-tools = ["baml-agent-runner/http-tools"]
memory = ["baml-agent-runner/memory"]
sandbox-provider = ["baml-agent-runner/sandbox-provider"]
dev-tools = ["baml-agent-runner/dev-tools"]

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }
test-support = { path = "../test-support" }
