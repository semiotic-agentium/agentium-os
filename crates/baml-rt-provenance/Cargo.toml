[package]
name = "baml-rt-provenance"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
publish = false

 [lib]
 name = "baml_rt_provenance"
 path = "src/lib.rs"

 [dependencies]
 baml-rt-core = { path = "../baml-rt-core" }
baml-rt-embedding = { path = "../baml-rt-embedding" }
baml-rt-id = { path = "../baml-rt-id" }
 baml-rt-interceptor = { path = "../baml-rt-interceptor" }
baml-rt-observability = { path = "../baml-rt-observability" }
baml-rt-tools = { path = "../baml-rt-tools" }
baml-rt-vocabulary = { path = "../baml-rt-vocabulary" }
dashmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
surrealdb = { workspace = true }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
tempfile = { workspace = true }
test-support = { path = "../test-support" }
criterion = "0.5"
paste = { workspace = true }

[features]
default = []
cli = ["dep:clap", "dep:anyhow"]

[[bin]]
name = "graph_exporter"
path = "src/bin/graph_exporter.rs"
required-features = ["cli"]
