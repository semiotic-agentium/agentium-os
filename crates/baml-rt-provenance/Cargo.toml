[package]
name = "baml-rt-provenance"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
publish = false

 [lib]
 name = "baml_rt_provenance"
 path = "src/lib.rs"

 [dependencies]
 baml-rt-core = { path = "../baml-rt-core" }
baml-rt-id = { path = "../baml-rt-id" }
 baml-rt-interceptor = { path = "../baml-rt-interceptor" }
baml-rt-observability = { path = "../baml-rt-observability" }
baml-rt-tools = { path = "../baml-rt-tools" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
text-to-cypher = { workspace = true }
testcontainers = { workspace = true, optional = true }
uuid = { workspace = true }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }

[features]
default = []
falkordb-tests = ["dep:testcontainers"]

[[bin]]
name = "validate_prov"
path = "../../validate_prov.rs"
