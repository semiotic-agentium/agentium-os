[package]
name = "baml-tool-links"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
publish = false
description = "Centralized force-link crate for all BAML tool crates"

[dependencies]
# Unconditional (core platform tools - always linked)
baml-rt-tools-claude = { path = "../tools/claude" }
baml-tools-system = { path = "../tools/system" }
baml-tools-calculator = { path = "../tools/calculator" }

# Feature-gated (integration tools)
baml-tools-clickup = { path = "../tools/clickup", optional = true }
baml-tools-github = { path = "../tools/github", optional = true }
baml-tools-memory = { path = "../tools/memory", optional = true }
baml-tools-notion = { path = "../tools/notion", optional = true }
baml-tools-security-eval = { path = "../tools/security-eval", optional = true }
baml-tools-slack = { path = "../tools/slack", optional = true }
baml-tools-slack-notify = { path = "../tools/slack-notify", optional = true }
baml-tools-grafana-alerts = { path = "../tools/grafana-alerts", optional = true }

# Test-only tools (not included in all-tools)
baml-tools-internal-dev = { path = "../tools/internal-dev", optional = true }

[features]
default = []
clickup = ["dep:baml-tools-clickup"]
github = ["dep:baml-tools-github"]
memory = ["dep:baml-tools-memory"]
notion = ["dep:baml-tools-notion"]
security-eval = ["dep:baml-tools-security-eval"]
slack = ["dep:baml-tools-slack"]
slack-notify = ["dep:baml-tools-slack-notify"]
grafana-alerts = ["dep:baml-tools-grafana-alerts"]
internal-dev = ["dep:baml-tools-internal-dev"]
http-tools = ["clickup", "github", "notion", "slack", "slack-notify", "security-eval", "grafana-alerts"]
all-tools = ["http-tools", "memory"]
