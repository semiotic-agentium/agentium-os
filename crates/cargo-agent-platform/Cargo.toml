[package]
name = "cargo-agent-platform"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
publish = false
description = "CLI tool for scaffolding BAML tools and agents"

[[bin]]
name = "cargo-agent-platform"
path = "src/main.rs"

[dependencies]
# Workspace runtime crates
baml-rt-core = { path = "../baml-rt-core" }
baml-rt-tools = { path = "../baml-rt-tools", default-features = false }
baml-rt-repository = { path = "../baml-rt-repository" }

# Centralized force-link crate - all-tools ensures complete inventory
baml-tool-links = { path = "../baml-tool-links", features = ["all-tools"] }

# CLI parsing
clap = { workspace = true }

# TOML editing (format-preserving)
toml_edit = "0.22"

# General utilities
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
reqwest-eventsource = "0.6"
futures-util = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }

# Terminal output formatting
console = "0.15"
indicatif = "0.17"

# Interactive prompts
inquire = "0.7"

# Builder for run_bootstrap and regen functionality
baml-rt-builder = { path = "../baml-rt-builder" }

# Async runtime for bootstrap and regen
tokio = { workspace = true }

# Temp files for regen sync
tempfile = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }
test-support = { path = "../test-support" }
