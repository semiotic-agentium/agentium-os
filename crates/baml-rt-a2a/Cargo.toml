[package]
name = "baml-rt-a2a"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
publish = false

[package.metadata.cargo-machete]
ignored = ["futures-util", "inventory"]

[dependencies]
baml-rt-core = { path = "../baml-rt-core" }
baml-rt-tools = { path = "../baml-rt-tools" }
baml-rt-tools-system = { path = "../tools/system" }
inventory = { workspace = true }
baml-rt-quickjs = { path = "../baml-rt-quickjs" }
baml-rt-observability = { path = "../baml-rt-observability" }
baml-rt-provenance = { path = "../baml-rt-provenance" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-channel = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
schemars = { workspace = true }
ts-rs = { workspace = true }
testcontainers = { workspace = true, optional = true }
text-to-cypher = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
test-support = { path = "../test-support" }
baml-rt = { path = "../baml-rt" }
insta = { workspace = true }
proptest = { workspace = true }

[features]
default = []
falkordb-tests = ["dep:testcontainers", "dep:text-to-cypher", "test-support/falkordb-tests"]
