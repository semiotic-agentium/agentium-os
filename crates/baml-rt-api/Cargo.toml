[package]
name = "baml-rt-api"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
publish = false
description = "HTTP API surface for BAML agent routing and discovery"

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
baml-rt-a2a = { path = "../baml-rt-a2a" }
baml-rt-config = { path = "../baml-rt-config" }
baml-rt-core = { path = "../baml-rt-core" }
baml-rt-llm-config = { path = "../baml-rt-llm-config" }
baml-rt-provenance = { path = "../baml-rt-provenance" }
baml-rt-repository = { path = "../baml-rt-repository" }
baml-rt-tools = { path = "../baml-rt-tools" }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
opentelemetry = { workspace = true }
http-api-problem = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
insta = { workspace = true, features = ["json"] }
tower = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
