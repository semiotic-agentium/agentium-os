[package]
name = "baml-ktool"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
publish = false
description = "Shared .ktool bundle types, digests, audit, and safe unpacking for the host authority layer and the guest supervisor."

# This crate is the no-drift seam between the host (which audits and publishes
# bundles) and the guest supervisor (which re-verifies and unpacks them inside
# the microVM). It must stay narrow-dep: no `baml-rt-core`, no `baml-rt-tools`,
# no tracing/observability. It ships into distroless guest images.

[dependencies]
baml-sandbox-protocol = { path = "../baml-sandbox-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
sha2 = { workspace = true }
semver = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
