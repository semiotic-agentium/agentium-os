[package]
name = "baml-tools-slack"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
publish = false
description = "Slack host tool for BAML runtime (read-only MVP)"

[features]
default = []
test-support = []

[dependencies]
baml-rt-core = { path = "../../baml-rt-core" }
baml-rt-tools = { path = "../../baml-rt-tools" }
baml-derive-core = { path = "../../baml-derive-core" }
baml-derive = { path = "../../baml-derive" }
integrations-slack-read = { path = "../../integrations/slack-read" }
serde_json = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
inventory = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
sha2 = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
test-support = { path = "../../test-support" }
