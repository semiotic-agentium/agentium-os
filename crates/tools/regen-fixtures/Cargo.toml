[package]
name = "baml-rt-regen-fixtures"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
publish = false
description = "Regenerate test fixture artifacts; links internal-dev so tool catalog resolves internal-dev/*"

[[bin]]
name = "regen-fixtures"
path = "src/main.rs"

[dependencies]
baml-rt-builder = { path = "../../baml-rt-builder" }
baml-rt-core = { path = "../../baml-rt-core" }
baml-rt-tools-internal-dev = { path = "../internal-dev" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
