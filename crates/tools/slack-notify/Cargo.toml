[package]
name = "baml-tools-slack-notify"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
publish = false
description = "Slack notification write tool for BAML runtime"

[dependencies]
baml-rt-core = { path = "../../baml-rt-core" }
baml-rt-tools = { path = "../../baml-rt-tools" }
baml-rt-llm-config = { path = "../../baml-rt-llm-config" }
baml-derive = { path = "../../baml-derive" }
baml-derive-core = { path = "../../baml-derive-core" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
inventory = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
