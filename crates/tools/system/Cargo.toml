[package]
name = "baml-tools-system"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
publish = false
description = "System tool bundle (e.g. system/a2a for agent-to-agent calls)"

[dependencies]
baml-rt-core = { path = "../../baml-rt-core" }
baml-rt-provenance = { path = "../../baml-rt-provenance" }
baml-rt-tools = { path = "../../baml-rt-tools" }
baml-derive = { path = "../../baml-derive" }
async-trait = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
async-channel = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
baml-tools-calculator = { path = "../calculator" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
insta = { workspace = true, features = ["json"] }
