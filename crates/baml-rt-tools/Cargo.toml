[package]
name = "baml-rt-tools"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
publish = false

[dependencies]
baml-rt-citation = { path = "../baml-rt-citation" }
baml-rt-core = { path = "../baml-rt-core" }
baml-sandbox-protocol = { path = "../baml-sandbox-protocol" }
baml-derive-core = { path = "../baml-derive-core" }
baml-derive = { path = "../baml-derive" }
baml-tool-derive = { path = "../baml-tool-derive" }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
genco = { workspace = true }
inventory = { workspace = true }
opentelemetry = { workspace = true }
dashmap = "6.1.0"
regex = "1"
sha2 = { workspace = true }
blake3 = "1.8"
getrandom = "0.3"
url = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
zeroize = { version = "1", features = ["derive"] }
# microsandbox is a beta crate ("expect breaking changes"). Exact pin per
# tool_sandbox.md §7.3; bumps go through explicit review. Behind the
# `sandbox-provider` feature so the runtime still builds when the beta crate
# has platform-specific build issues; the `SandboxProvider` trait boundary
# isolates the rest of the runtime from the churn.
microsandbox = { version = "=0.3.13", optional = true }

[features]
default = []
# No-op for CI/workspace feature parity; runner and builder enable clickup/notion via their own deps.
http-tools = []
# Exposes `ingress_store::test_support::MemoryIngressStore` for cross-crate tests.
test-support = []
# Compile-time gate for MicrosandboxProvider. When off, the runner uses
# MockSandboxProvider in tests or no sandbox at all in release builds.
sandbox-provider = ["dep:microsandbox"]
# KVM-gated real microVM E2E lane. Off by default and only enabled in
# dedicated CI/manual runs.
sandbox-e2e-kvm = ["sandbox-provider"]

[dev-dependencies]
test-support = { path = "../test-support" }
baml-rt = { path = "../baml-rt" }
baml-tools-calculator = { path = "../tools/calculator" }
tempfile = { workspace = true }
