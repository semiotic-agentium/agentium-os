name: Release PR postprocess

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-pr-postprocess-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cargo-lock:
    name: Update Cargo.lock on Release Please PRs
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Update workspace lockfile versions
        run: cargo update --workspace

      - name: Commit Cargo.lock if changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: update Cargo.lock for release"
          git push
