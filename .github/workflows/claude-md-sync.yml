name: Doc Sync

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: doc-sync
  cancel-in-progress: true

jobs:
  sync-docs:
    name: Sync reference docs
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Refresh apt indices (retry; mitigates mirror sync races)
        run: bash scripts/ci/apt-update-retry.sh

      - name: Ensure required tools
        run: |
          command -v jq >/dev/null || sudo apt-get install -y jq
          command -v gh >/dev/null || sudo apt-get install -y gh

      - name: Check skip conditions
        id: skip-check
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD^1..HEAD)

          if [ -z "$CHANGED_FILES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Empty diffstat, skipping"
            exit 0
          fi

          NON_DOC_ONLY=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              CLAUDE.md|docs/README.md|docs/reference/*|docs/runbooks/*) ;;
              *) NON_DOC_ONLY=1; break ;;
            esac
          done <<< "$CHANGED_FILES"

          if [ "$NON_DOC_ONLY" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Only bot-maintained doc files changed, skipping loop"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Propose doc updates
        if: steps.skip-check.outputs.skip != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SHA_SHORT=$(git rev-parse --short HEAD)
          COMMIT_SHA=$(git rev-parse HEAD)
          MERGE_SUBJECT=$(git log -1 --format="%s" | head -c 50)

          MERGE_COMMIT=$(git log -1 --format="%s%n%n%b")
          DIFFSTAT=$(git diff --stat HEAD^1..HEAD)

          CARGO_DIFF=$(git diff HEAD^1..HEAD -- Cargo.toml '*/Cargo.toml' 2>/dev/null) || true
          [ -z "$CARGO_DIFF" ] && CARGO_DIFF="No changes"

          INFRA_DIFF=$(git diff HEAD^1..HEAD -- justfile '.github/workflows/' 'deploy/' 'scripts/' 2>/dev/null) || true
          [ -z "$INFRA_DIFF" ] && INFRA_DIFF="No changes"

          API_DIFF=$(git diff HEAD^1..HEAD -- \
            crates/baml-rt-api/src/router.rs \
            crates/baml-rt-api/src/handlers.rs \
            crates/baml-rt-api/src/openapi.rs \
            crates/baml-agent-runner/src/main.rs \
            crates/baml-agent-runner/src/deployment_state.rs \
            crates/cargo-agent-platform/src/main.rs \
            2>/dev/null) || true
          [ -z "$API_DIFF" ] && API_DIFF="No changes"

          METRICS_DIFF=$(git diff HEAD^1..HEAD -- \
            '**/metrics.rs' \
            crates/baml-rt-core/src/effect_metrics.rs \
            2>/dev/null) || true
          [ -z "$METRICS_DIFF" ] && METRICS_DIFF="No changes"

          HELM_DIFF=$(git diff HEAD^1..HEAD -- deploy/helm/agentium-os/ 2>/dev/null) || true
          [ -z "$HELM_DIFF" ] && HELM_DIFF="No changes"

          CLAUDE_DIFF=$(git diff HEAD^1..HEAD -- CLAUDE.md 2>/dev/null) || true
          [ -z "$CLAUDE_DIFF" ] && CLAUDE_DIFF="None"

          CURRENT_CLAUDE=$(cat CLAUDE.md)

          cat > /tmp/system_prompt.txt << 'SYSPROMPT'
          You maintain Agentium OS documentation after merges to main.

          Responsibilities (ONLY these paths):
          - CLAUDE.md — slim pointer hub (~100 lines max): build commands, doc map entry, crate one-liners. Never restore long architecture prose (defer to README.md and docs/README.md).
          - docs/reference/** — factual system-as-is reference
          - docs/runbooks/** — install, demo, ops steps

          Do NOT edit docs/assertions/** (normative invariants; human-reviewed only).

          Path → doc routing when code changes:
          - crates/baml-rt-api/src/router.rs, handlers.rs → docs/reference/agent-runner.md
          - crates/baml-agent-runner/** deploy/restore → docs/reference/deployment-lifecycle-contract.md
          - crates/cargo-agent-platform/** → docs/reference/sdk-cli.md
          - crates/baml-rt-mcp/**, repository MCP routes → docs/reference/agentium-mcp-support.md
          - **/metrics.rs, effect_metrics.rs → docs/reference/metrics-inventory.md
          - deploy/helm/agentium-os/** → docs/runbooks/k8s-pilot-operator-guide.md
          - New top-level crate dir → CLAUDE.md crate table (+ docs/README.md if needed)

          Canonical facts to preserve:
          - A2A SSE on POST .../a2a only (no /a2a/sse route)
          - Cluster mode = --surreal-endpoint (not RUNNER_TOKEN alone)
          - Tool FSM ops: Open, Send, SearchRead, PageRead, Finish, Abort
          - Graph-first reads: traverse edges; never parse node ID prefixes for relationships

          Output format:
          - JSON object mapping relative file paths to full file contents for ONLY changed files, e.g.
            {"CLAUDE.md":"...", "docs/reference/agent-runner.md":"..."}
          - If no updates needed, output exactly: NO_CHANGES_NEEDED
          - Output ONLY that JSON object or NO_CHANGES_NEEDED — no preamble, no markdown fences, no commentary.
          SYSPROMPT

          {
            printf 'Merge commit\n\n%s\n\n' "$MERGE_COMMIT"
            printf 'Diffstat\n\n%s\n\n' "$DIFFSTAT"
            printf 'Cargo.toml changes\n\n%s\n\n' "$CARGO_DIFF"
            printf 'Infrastructure changes\n\n%s\n\n' "$INFRA_DIFF"
            printf 'API/runner/CLI changes\n\n%s\n\n' "$API_DIFF"
            printf 'Metrics changes\n\n%s\n\n' "$METRICS_DIFF"
            printf 'Helm changes\n\n%s\n\n' "$HELM_DIFF"
            printf 'Direct CLAUDE.md edits in this merge\n\n%s\n\n' "$CLAUDE_DIFF"
            printf 'Current CLAUDE.md\n\n%s\n' "$CURRENT_CLAUDE"
          } > /tmp/user_message.txt

          jq -n \
            --arg model "anthropic/claude-sonnet-4" \
            --rawfile system /tmp/system_prompt.txt \
            --rawfile user /tmp/user_message.txt \
            '{
              model: $model,
              temperature: 0,
              max_tokens: 32000,
              messages: [
                { role: "system", content: $system },
                { role: "user", content: $user }
              ]
            }' > /tmp/api_payload.json

          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/api_response.json \
            --max-time 180 \
            -X POST "https://openrouter.ai/api/v1/chat/completions" \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://github.com/agentium-os/agent-platform" \
            -H "X-Title: Agentium OS Doc Sync" \
            -d @/tmp/api_payload.json)

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::OpenRouter API returned HTTP $HTTP_CODE"
            cat /tmp/api_response.json
            exit 1
          fi

          RESPONSE=$(jq -r '.choices[0].message.content // empty' /tmp/api_response.json)
          FINISH_REASON=$(jq -r '.choices[0].finish_reason // empty' /tmp/api_response.json)

          if [ -z "$RESPONSE" ]; then
            echo "::error::Empty or malformed API response"
            cat /tmp/api_response.json
            exit 1
          fi

          if [ "$FINISH_REASON" = "length" ]; then
            echo "::error::Model response truncated (finish_reason=length); narrow the diff or raise max_tokens"
            printf '%s\n' "$RESPONSE" | tail -c 2000
            exit 1
          fi

          if ! PARSED=$(printf '%s' "$RESPONSE" | python3 scripts/ci/parse-doc-sync-response.py); then
            echo "::error::Expected JSON object or NO_CHANGES_NEEDED"
            printf '%s\n' "$RESPONSE" | head -c 2000
            exit 1
          fi

          if [ "$PARSED" = "NO_CHANGES_NEEDED" ]; then
            echo "::notice::No doc changes needed for this merge"
            exit 0
          fi

          printf '%s' "$PARSED" > /tmp/doc_sync_parsed.json
          RESPONSE="$PARSED"

          CHANGED=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              CLAUDE.md|docs/reference/*|docs/runbooks/*) ;;
              *)
                echo "::error::Refusing to write disallowed path: $path"
                exit 1
                ;;
            esac
            content=$(printf '%s' "$RESPONSE" | jq -r --arg p "$path" '.[$p]')
            if [ "$content" = "null" ] || [ -z "$content" ]; then
              continue
            fi
            mkdir -p "$(dirname "$path")"
            printf '%s\n' "$content" > "$path"
            CHANGED=1
          done < <(printf '%s' "$RESPONSE" | jq -r 'keys[]')

          if [ "$CHANGED" -eq 0 ]; then
            echo "::notice::JSON contained no writable file entries"
            exit 0
          fi

          bash scripts/check-doc-links.sh
          bash scripts/check-doc-claims.sh

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          EXISTING_PR_JSON=$(gh pr list --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("auto/doc-sync-"))][0] // empty' \
            2>/dev/null || true)

          if [ -n "$EXISTING_PR_JSON" ]; then
            EXISTING_PR=$(echo "$EXISTING_PR_JSON" | jq -r '.number')
            EXISTING_BRANCH=$(echo "$EXISTING_PR_JSON" | jq -r '.headRefName')
            echo "::notice::Updating existing PR #${EXISTING_PR} on branch ${EXISTING_BRANCH}"
            git fetch origin "$EXISTING_BRANCH" 2>/dev/null || true
            git checkout -B "$EXISTING_BRANCH" HEAD
            git add CLAUDE.md docs/reference docs/runbooks
            git commit -m "docs: sync reference docs with ${COMMIT_SHA:0:7}"
            git push origin "$EXISTING_BRANCH" --force-with-lease
          else
            BRANCH_NAME="auto/doc-sync-${SHA_SHORT}"
            echo "::notice::Creating branch ${BRANCH_NAME}"
            git checkout -b "$BRANCH_NAME"
            git add CLAUDE.md docs/reference docs/runbooks
            git commit -m "docs: sync reference docs with ${COMMIT_SHA:0:7}"
            git push origin "$BRANCH_NAME"

            gh label create doc-sync \
              --description "Automated reference/runbook doc updates" \
              --color "0075ca" 2>/dev/null || true

            {
              printf 'Proposed reference/runbook doc updates based on %s.\n\n' "$COMMIT_SHA"
              printf '<details>\n<summary>Diffstat</summary>\n\n'
              printf '```\n%s\n```\n\n' "$DIFFSTAT"
              printf '</details>\n'
            } > /tmp/pr_body.txt

            gh pr create \
              --title "docs: sync reference docs with ${MERGE_SUBJECT}" \
              --body-file /tmp/pr_body.txt \
              --label "doc-sync" \
              --base main \
              --head "$BRANCH_NAME" 2>/tmp/gh_pr_err || \
            gh pr create \
              --title "docs: sync reference docs with ${MERGE_SUBJECT}" \
              --body-file /tmp/pr_body.txt \
              --base main \
              --head "$BRANCH_NAME" || {
                REPO_URL=$(gh repo view --json url -q '.url')
                echo "::warning::Could not create PR. Branch: ${REPO_URL}/compare/main...${BRANCH_NAME}"
              }
          fi
