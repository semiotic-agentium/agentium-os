name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # rust-cache needs write to save cache entries
  packages: read
  checks: write   # required for JUnit report action to create check runs

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_INCREMENTAL: "false"
  CARGO_PROFILE_TEST_INCREMENTAL: "false"
  # Prefer workspace-local ONNX model cache in CI for deterministic loading.
  BAML_MODELS_DIR: ${{ github.workspace }}/models
  # Disable OTEL exporters in CI tests to avoid noisy collector connection errors
  # and timing variance when no collector is available.
  OTEL_SDK_DISABLED: "true"
  OTEL_TRACES_EXPORTER: "none"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""

jobs:
  nextest:
    name: Nextest (workspace)
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4

      - name: Ensure zstd available
        run: |
          if ! command -v zstd &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y zstd
          fi

      - name: Ensure ONNX model artifacts are materialized (git-lfs)
        run: |
          if ! command -v git-lfs &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y git-lfs
          fi
          git lfs install --local
          # Best-effort hydrate checked-in model blobs; validation/repair happens
          # in the dedicated warm-up step via fastembed model initialization.
          git lfs pull --include="models/fastembed/**"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Enforce formatting (nightly rustfmt)
        run: cargo +nightly fmt --check

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-nextest"
          cache-on-failure: true
          cache-targets: "true"

      - name: Cache ONNX model artifacts
        uses: actions/cache@v4
        with:
          path: |
            models/fastembed
            ~/.cache/fastembed
          key: ${{ runner.os }}-fastembed-v1-${{ hashFiles('crates/baml-rt-embedding/Cargo.toml', 'crates/baml-rt-embedding/src/bin/download_models.rs') }}
          restore-keys: |
            ${{ runner.os }}-fastembed-v1-

      - name: Install build dependencies
        run: |
          sudo apt update && sudo apt install -y build-essential pkg-config libssl-dev libclang-dev util-linux lld

      - name: Install Node.js and TypeScript
        run: |
          if ! command -v node &>/dev/null; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi
          # Pin TS 6.x: builder agents rely on tsc behaviour guarded in tsconfig (e.g. rootDir ./src).
          # Unpinned `typescript` tracks latest major and can break CI without a coordinated bump.
          sudo npm install -g typescript@6
          tsc --version
          tsc --version | grep -qE '^Version 6\.' || {
            echo "error: expected global tsc 6.x (got $(tsc --version))"
            exit 1
          }

      - name: Warm ONNX caches and validate model load
        run: |
          cargo run -p baml-rt-embedding --bin download_models
        env:
          RUSTUP_TOOLCHAIN: stable

      - name: Workspace integrity check
        run: cargo run -p cargo-agent-platform -- doctor --ci

      - name: System info
        run: |
          echo "=== lscpu ==="
          lscpu
          echo "=== nproc ==="
          nproc
          echo "=== memory (free -h) ==="
          free -h
          echo "=== uname -a ==="
          uname -a

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Write fnox secrets
        # Generates fnox.toml with explicit `default` values from CI secret variables.
        # FnoxFileSecretResolver reads values directly from the file — no env var fallback.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLICKUP_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
        run: |
          cat > fnox.toml << EOF
          [secrets.OPENROUTER_API_KEY]
          description = "OpenRouter API key"
          default = "$OPENROUTER_API_KEY"

          [secrets.CLICKUP_API_KEY]
          description = "ClickUp personal API token"
          default = "$CLICKUP_API_KEY"

          [secrets.NOTION_API_TOKEN]
          description = "Notion integration token"
          default = "$NOTION_API_TOKEN"

          [secrets.SLACK_BOT_TOKEN]
          description = "Slack bot token (xoxb-...)"
          default = "$SLACK_BOT_TOKEN"

          [secrets.SLACK_USER_TOKEN]
          description = "Slack user token (xoxp-...)"
          default = "$SLACK_USER_TOKEN"
          EOF

      - name: Run nextest (LLM suite)
        run: |
          # LLM tests with full parallelism (no thread limits).
          # Tests gated by #[cfg(feature = "llm-tests")] compile only when feature enabled.
          echo ">>> nextest LLM suite: full parallelism (nproc=$(nproc))"
          cargo nextest run --workspace --locked --profile ci-llm --no-fail-fast \
            --features baml-rt-tools/http-tools,baml-rt-builder/http-tools,baml-rt-builder/llm-tests,baml-agent-runner/http-tools,baml-agent-runner/memory,baml-rt/llm-tests,baml-agent-runner/llm-tests
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OTEL_SDK_DISABLED: "true"
          OTEL_TRACES_EXPORTER: "none"
          OTEL_METRICS_EXPORTER: "none"
          OTEL_LOGS_EXPORTER: "none"
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ""

      - name: Run nextest (non-LLM suite)
        run: |
          # Non-LLM tests with full parallelism.
          # LLM-gated tests don't compile without llm-tests feature.
          echo ">>> nextest non-LLM suite: full parallelism (nproc=$(nproc))"
          cargo nextest run --workspace --locked --profile ci-non-llm --no-fail-fast \
            --features baml-rt-tools/http-tools,baml-rt-builder/http-tools,baml-agent-runner/http-tools,baml-agent-runner/memory
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OTEL_SDK_DISABLED: "true"
          OTEL_TRACES_EXPORTER: "none"
          OTEL_METRICS_EXPORTER: "none"
          OTEL_LOGS_EXPORTER: "none"
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ""

      - name: Publish JUnit report (LLM suite)
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "target/nextest/ci-llm/junit-llm.xml"
          require_tests: false
          check_name: Nextest results (LLM)

      - name: Publish JUnit report (non-LLM suite)
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "target/nextest/ci-non-llm/junit-non-llm.xml"
          require_tests: false
          check_name: Nextest results (non-LLM)
