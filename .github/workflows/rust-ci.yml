name: Rust CI

# Trusted vs untrusted lanes: fork PRs run on ubuntu-latest without secrets or
# llm-tests; same-repo PRs, push to main, and workflow_dispatch use self-hosted
# runners with full secrets. See docs/runbooks/ci-security.md.

# NOTE (Issue #12): Automatic push/pull_request triggers are temporarily
# commented out below AND this workflow is manually disabled in GitHub Actions
# UI/API (`disabled_manually` via `gh workflow disable`) because the trusted lane
# requires unprovisioned self-hosted runners (`arc-runner-set`) and paid LLM API
# credits (`OPENROUTER_API_KEY`). Re-enable once runner infrastructure or a
# free `ubuntu-latest` non-LLM lane is configured.
on:
  # push:
  #   branches: [main]
  #   tags-ignore:
  #     - '**'
  #   # Documentation-only edits do not affect the Rust artifact graph; skipping
  #   # avoids spinning ~30min nextest lanes and cancelling in-flight runs via
  #   # extra pushes (see paths-ignore semantics for bundled PR diffs).
  #   paths-ignore:
  #     - 'docs/**'
  #     - '**/*.md'
  # pull_request:
  #   paths-ignore:
  #     - 'docs/**'
  #     - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read  # required for dorny/paths-filter to list PR changed files
  actions: write  # rust-cache needs write to save cache entries
  packages: read
  checks: write   # required for JUnit report action to create check runs

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_INCREMENTAL: "false"
  CARGO_PROFILE_TEST_INCREMENTAL: "false"
  # Trusted lane: LLM integration tests + secret-backed fnox.toml (same-repo PRs,
  # push to main, workflow_dispatch). Untrusted lane omits llm-tests features.
  CI_FEATURES_TRUSTED: >-
    baml-rt-tools/http-tools,baml-rt-builder/http-tools,baml-rt-builder/dev-tools,baml-rt-builder/llm-tests,
    baml-agent-runner/http-tools,baml-agent-runner/memory,baml-rt/llm-tests,
    baml-agent-runner/llm-tests
  CI_FEATURES_UNTRUSTED: >-
    baml-rt-tools/http-tools,baml-rt-builder/http-tools,baml-rt-builder/dev-tools,baml-agent-runner/http-tools,
    baml-agent-runner/memory
  # Disable OTEL exporters in CI tests to avoid noisy collector connection errors
  # and timing variance when no collector is available.
  OTEL_SDK_DISABLED: "true"
  OTEL_TRACES_EXPORTER: "none"
  OTEL_METRICS_EXPORTER: "none"
  # Model id the llm-tests lane targets. Source: `vars.BAML_TEST_MODEL` repo
  # variable; fallback to the historical literal so behaviour matches main
  # when the variable is unset. See issue #429.
  BAML_TEST_MODEL: ${{ vars.BAML_TEST_MODEL || 'x-ai/grok-4.3' }}
  OTEL_LOGS_EXPORTER: "none"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""

jobs:
  changes:
    name: Detect trusted context
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - run: echo "trusted=${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"

  nextest:
    name: Nextest (workspace)
    runs-on: arc-runner-set
    needs: changes
    if: needs.changes.outputs.trusted == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Refresh apt indices (retry; mitigates mirror sync races)
        run: bash scripts/ci/apt-update-retry.sh

      - name: Install OS build deps
        run: |
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libdbus-1-dev libcap-ng-dev \
            libclang-dev clang llvm-dev util-linux lld \
            zstd git-lfs

      - name: Configure LIBCLANG_PATH for bindgen (hirofa-quickjs-sys)
        run: bash scripts/ci/set-libclang-path.sh

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Enforce formatting (nightly rustfmt)
        run: cargo +nightly fmt --check

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-nextest"
          cache-on-failure: true
          cache-targets: "true"
          # Only main pushes (and manual dispatches) repopulate the shared
          # cache. PRs restore-only — the post-job cache save would otherwise
          # cost ~9 min compressing/uploading target/ on every PR run.
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

      - name: Install Node.js and TypeScript
        run: |
          if ! command -v node &>/dev/null; then
            for attempt in $(seq 1 5); do
              if curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash - \
                && sudo apt-get install -y nodejs; then
                break
              fi
              echo "NodeSource install failed (attempt ${attempt}/5); sleeping 30s before retry..." >&2
              if [ "$attempt" -eq 5 ]; then
                exit 1
              fi
              sleep 30
              bash scripts/ci/apt-update-retry.sh || true
            done
          fi
          # Pin TS 6.x: the canonical agent tsconfig uses `moduleResolution: "bundler"` with
          # `module: "ESNext"` (see `crates/baml-rt-builder/src/builder/compiler/tsc.rs`). The
          # runner Dockerfile installs `typescript@6` globally, so CI must match to keep
          # fixture builds consistent with the runner image. Unpinned `typescript` tracks
          # latest major and can break CI without a coordinated bump.
          sudo npm install -g typescript@6
          tsc --version
          tsc --version | grep -qE '^Version 6\.' || {
            echo "error: expected global tsc 6.x (got $(tsc --version))"
            exit 1
          }

      - name: System info
        run: |
          echo "=== lscpu ==="
          lscpu
          echo "=== nproc ==="
          nproc
          echo "=== memory (free -h) ==="
          free -h
          echo "=== uname -a ==="
          uname -a

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Write fnox secrets
        # Generates fnox.toml with explicit `default` values from CI secret variables.
        # FnoxFileSecretResolver reads values directly from the file — no env var fallback.
        # BAML_TEST_MODEL is the env-controlled test-model knob from issue #429 —
        # source: `vars.BAML_TEST_MODEL` repo variable, fallback `x-ai/grok-4.3`.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLICKUP_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          BAML_TEST_MODEL: ${{ vars.BAML_TEST_MODEL || 'x-ai/grok-4.3' }}
        run: |
          cat > fnox.toml << EOF
          [secrets.OPENROUTER_API_KEY]
          description = "OpenRouter API key"
          default = "$OPENROUTER_API_KEY"

          [secrets.BAML_TEST_MODEL]
          description = "Test model id (BAML env.BAML_TEST_MODEL)"
          default = "$BAML_TEST_MODEL"

          [secrets.CLICKUP_API_KEY]
          description = "ClickUp personal API token"
          default = "$CLICKUP_API_KEY"

          [secrets.NOTION_API_TOKEN]
          description = "Notion integration token"
          default = "$NOTION_API_TOKEN"

          [secrets.SLACK_BOT_TOKEN]
          description = "Slack bot token (xoxb-...)"
          default = "$SLACK_BOT_TOKEN"

          [secrets.SLACK_USER_TOKEN]
          description = "Slack user token (xoxp-...)"
          default = "$SLACK_USER_TOKEN"
          EOF

      - name: Clippy (workspace)
        run: |
          # Lints the same artifact graph the nextest step below compiles, so
          # the workspace `target/` warmed by this step is reused — net cost
          # is the rmeta diff, not a second cold workspace build.
          # Feature set must stay aligned with the nextest step's --features
          # list; `--all-features` is explicitly forbidden (see comment there)
          # because `sandbox-e2e-kvm` must only compile in the dedicated KVM
          # workflow. Catches workspace-clippy regressions like #419 on every
          # PR — the bar `CLAUDE.md` and the pre-commit hook prescribe.
          cargo clippy --workspace --all-targets --locked \
            --features "${{ env.CI_FEATURES_TRUSTED }}" \
            -- -D warnings
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

      - name: Run nextest (workspace)
        run: |
          # Single workspace pass with the union feature set (LLM + non-LLM).
          # Tests gated by #[cfg(feature = "llm-tests")] compile when llm-tests is enabled,
          # producing one artifact graph that contains every test.
          # IMPORTANT: keep explicit feature list here (do NOT switch to --all-features).
          # `sandbox-e2e-kvm` must only compile in .github/workflows/sandbox-e2e-kvm.yml
          # on KVM-capable runners.
          echo ">>> nextest workspace: full parallelism (nproc=$(nproc))"
          # `baml-agent-runner/cluster-tests` deferred from CI: the k3d cluster
          # setup over-commits the 2-vCPU GitHub runner, starving the rest of
          # the suite (see #367). Re-enable once cluster tests run on isolated
          # infrastructure.
          cargo nextest run --workspace --locked --profile ci-merged --no-fail-fast \
            --features "${{ env.CI_FEATURES_TRUSTED }}"
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OTEL_SDK_DISABLED: "true"
          OTEL_TRACES_EXPORTER: "none"
          OTEL_METRICS_EXPORTER: "none"
          OTEL_LOGS_EXPORTER: "none"
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ""

      - name: Publish JUnit report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "target/nextest/ci-merged/junit.xml"
          require_tests: false
          check_name: Nextest results

  nextest-untrusted:
    name: Nextest (workspace)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.trusted != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install OS build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libdbus-1-dev libcap-ng-dev \
            libclang-dev clang llvm-dev util-linux lld \
            zstd git-lfs

      - name: Configure LIBCLANG_PATH for bindgen (hirofa-quickjs-sys)
        run: bash scripts/ci/set-libclang-path.sh

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Enforce formatting (nightly rustfmt)
        run: cargo +nightly fmt --check

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-nextest-untrusted"
          cache-on-failure: true
          cache-targets: "true"
          save-if: false

      - name: Install Node.js and TypeScript
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install -y nodejs
          sudo npm install -g typescript@6

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Clippy (workspace, no llm-tests)
        run: |
          cargo clippy --workspace --all-targets --locked \
            --features "${{ env.CI_FEATURES_UNTRUSTED }}" \
            -- -D warnings
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

      - name: Run nextest (workspace, no llm-tests)
        run: |
          echo ">>> nextest untrusted lane: fork PR — no secrets, no llm-tests features"
          cargo nextest run --workspace --locked --profile ci-merged --no-fail-fast \
            --features "${{ env.CI_FEATURES_UNTRUSTED }}"
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
          OTEL_SDK_DISABLED: "true"
          OTEL_TRACES_EXPORTER: "none"
          OTEL_METRICS_EXPORTER: "none"
          OTEL_LOGS_EXPORTER: "none"
          OTEL_EXPORTER_OTLP_ENDPOINT: ""

      - name: Publish JUnit report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "target/nextest/ci-merged/junit.xml"
          require_tests: false
          check_name: Nextest results (fork)
