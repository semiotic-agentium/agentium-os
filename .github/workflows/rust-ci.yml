name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read  # required for dorny/paths-filter to list PR changed files
  actions: write  # rust-cache needs write to save cache entries
  packages: read
  checks: write   # required for JUnit report action to create check runs

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_INCREMENTAL: "false"
  CARGO_PROFILE_TEST_INCREMENTAL: "false"
  # Prefer workspace-local ONNX model cache in CI for deterministic loading.
  BAML_MODELS_DIR: ${{ github.workspace }}/models
  # Disable OTEL exporters in CI tests to avoid noisy collector connection errors
  # and timing variance when no collector is available.
  OTEL_SDK_DISABLED: "true"
  OTEL_TRACES_EXPORTER: "none"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""

jobs:
  changes:
    name: Detect sandbox lane changes
    runs-on: arc-runner-set
    outputs:
      sandbox_changed: ${{ steps.filter.outputs.sandbox }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sandbox:
              - 'crates/baml-sandbox-adapter/**'
              - 'crates/baml-sandbox-protocol/**'
              - 'crates/baml-rt-tools/tests/fixtures/external-tools/sandbox_echo/adapter/**'
              - '.github/workflows/rust-ci.yml'

  nextest:
    name: Nextest (workspace)
    runs-on: arc-runner-set
    needs: changes
    steps:
      - uses: actions/checkout@v4

      - name: Refresh apt indices (retry; mitigates mirror sync races)
        run: bash scripts/ci/apt-update-retry.sh

      - name: Ensure zstd available
        run: |
          if ! command -v zstd &>/dev/null; then
            sudo apt-get install -y zstd
          fi

      - name: Ensure ONNX model artifacts are materialized (git-lfs)
        run: |
          if ! command -v git-lfs &>/dev/null; then
            sudo apt-get install -y git-lfs
          fi
          git lfs install --local
          # Best-effort hydrate checked-in model blobs; validation/repair happens
          # in the dedicated warm-up step via fastembed model initialization.
          git lfs pull --include="models/fastembed/**"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Enforce formatting (nightly rustfmt)
        run: cargo +nightly fmt --check

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-nextest"
          cache-on-failure: true
          cache-targets: "true"

      - name: Cache ONNX model artifacts
        uses: actions/cache@v4
        with:
          path: |
            models/fastembed
            ~/.cache/fastembed
          key: ${{ runner.os }}-fastembed-v1-${{ hashFiles('crates/baml-rt-embedding/Cargo.toml', 'crates/baml-rt-embedding/src/bin/download_models.rs') }}
          restore-keys: |
            ${{ runner.os }}-fastembed-v1-

      - name: Install build dependencies
        run: |
          sudo apt-get install -y build-essential pkg-config libssl-dev libclang-dev util-linux lld

      - name: Install Node.js and TypeScript
        run: |
          if ! command -v node &>/dev/null; then
            for attempt in $(seq 1 5); do
              if curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash - \
                && sudo apt-get install -y nodejs; then
                break
              fi
              echo "NodeSource install failed (attempt ${attempt}/5); sleeping 30s before retry..." >&2
              if [ "$attempt" -eq 5 ]; then
                exit 1
              fi
              sleep 30
              bash scripts/ci/apt-update-retry.sh || true
            done
          fi
          # Pin TS 6.x: builder agents rely on tsc behaviour guarded in tsconfig (e.g. rootDir ./src).
          # Unpinned `typescript` tracks latest major and can break CI without a coordinated bump.
          sudo npm install -g typescript@6
          tsc --version
          tsc --version | grep -qE '^Version 6\.' || {
            echo "error: expected global tsc 6.x (got $(tsc --version))"
            exit 1
          }

      - name: Warm ONNX caches and validate model load
        run: |
          cargo run -p baml-rt-embedding --bin download_models
        env:
          RUSTUP_TOOLCHAIN: stable

      - name: Workspace integrity check
        run: cargo run -p cargo-agent-platform -- doctor --ci

      - name: System info
        run: |
          echo "=== lscpu ==="
          lscpu
          echo "=== nproc ==="
          nproc
          echo "=== memory (free -h) ==="
          free -h
          echo "=== uname -a ==="
          uname -a

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Write fnox secrets
        # Generates fnox.toml with explicit `default` values from CI secret variables.
        # FnoxFileSecretResolver reads values directly from the file — no env var fallback.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLICKUP_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
        run: |
          cat > fnox.toml << EOF
          [secrets.OPENROUTER_API_KEY]
          description = "OpenRouter API key"
          default = "$OPENROUTER_API_KEY"

          [secrets.CLICKUP_API_KEY]
          description = "ClickUp personal API token"
          default = "$CLICKUP_API_KEY"

          [secrets.NOTION_API_TOKEN]
          description = "Notion integration token"
          default = "$NOTION_API_TOKEN"

          [secrets.SLACK_BOT_TOKEN]
          description = "Slack bot token (xoxb-...)"
          default = "$SLACK_BOT_TOKEN"

          [secrets.SLACK_USER_TOKEN]
          description = "Slack user token (xoxp-...)"
          default = "$SLACK_USER_TOKEN"
          EOF

      - name: Run nextest (LLM suite)
        run: |
          # LLM tests with full parallelism (no thread limits).
          # Tests gated by #[cfg(feature = "llm-tests")] compile only when feature enabled.
          # IMPORTANT: keep explicit feature list here (do NOT switch to --all-features).
          # `sandbox-e2e-kvm` must only compile in .github/workflows/sandbox-e2e-kvm.yml
          # on KVM-capable runners.
          echo ">>> nextest LLM suite: full parallelism (nproc=$(nproc))"
          # Adapter SDK + echo fixture are covered by downstream sandbox jobs
          # in this workflow; excluding them here keeps each test in one lane.
          cargo nextest run --workspace --locked --profile ci-llm --no-fail-fast \
            --exclude baml-sandbox-adapter --exclude sandbox-echo-adapter \
            --features baml-rt-tools/http-tools,baml-rt-builder/http-tools,baml-rt-builder/llm-tests,baml-agent-runner/http-tools,baml-agent-runner/memory,baml-rt/llm-tests,baml-agent-runner/llm-tests
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OTEL_SDK_DISABLED: "true"
          OTEL_TRACES_EXPORTER: "none"
          OTEL_METRICS_EXPORTER: "none"
          OTEL_LOGS_EXPORTER: "none"
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ""

      - name: Run nextest (non-LLM suite)
        run: |
          # Non-LLM tests with full parallelism.
          # LLM-gated tests don't compile without llm-tests feature.
          # IMPORTANT: keep explicit feature list here (do NOT switch to --all-features).
          # `sandbox-e2e-kvm` must only compile in .github/workflows/sandbox-e2e-kvm.yml
          # on KVM-capable runners.
          echo ">>> nextest non-LLM suite: full parallelism (nproc=$(nproc))"
          cargo nextest run --workspace --locked --profile ci-non-llm --no-fail-fast \
            --exclude baml-sandbox-adapter --exclude sandbox-echo-adapter \
            --features baml-rt-tools/http-tools,baml-rt-builder/http-tools,baml-agent-runner/http-tools,baml-agent-runner/memory
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OTEL_SDK_DISABLED: "true"
          OTEL_TRACES_EXPORTER: "none"
          OTEL_METRICS_EXPORTER: "none"
          OTEL_LOGS_EXPORTER: "none"
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ""

      - name: Publish JUnit report (LLM suite)
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "target/nextest/ci-llm/junit-llm.xml"
          require_tests: false
          check_name: Nextest results (LLM)

      - name: Publish JUnit report (non-LLM suite)
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "target/nextest/ci-non-llm/junit-non-llm.xml"
          require_tests: false
          check_name: Nextest results (non-LLM)

  sandbox-adapter:
    name: Sandbox adapter (stdio E2E + protocol)
    runs-on: arc-runner-set
    needs: [changes, nextest]
    if: needs.changes.outputs.sandbox_changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-sandbox-adapter"
          cache-on-failure: true
          cache-targets: "true"

      - name: Install build dependencies
        run: |
          sudo apt update && sudo apt install -y build-essential pkg-config lld

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build echo adapter fixture
        run: cargo build -p sandbox-echo-adapter --locked
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

      - name: Clippy
        run: |
          cargo clippy \
            -p baml-sandbox-adapter \
            -p baml-sandbox-protocol \
            --all-targets --locked -- -D warnings

      - name: Nextest
        run: |
          cargo nextest run \
            -p baml-sandbox-adapter \
            -p baml-sandbox-protocol \
            --locked --profile ci --no-fail-fast
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

      - name: Publish JUnit report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "target/nextest/ci/junit.xml"
          require_tests: true
          check_name: Sandbox adapter nextest

  sandbox-adapter-image:
    name: Sandbox adapter image (no-publish)
    runs-on: arc-runner-set
    needs: [changes, nextest]
    if: needs.changes.outputs.sandbox_changed == 'true'
    env:
      IMAGE_NAME: sandbox-echo-adapter
      IMAGE_TAG: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally (no push)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -f crates/baml-rt-tools/tests/fixtures/external-tools/sandbox_echo/adapter/Dockerfile \
            -t ${IMAGE_NAME}:${IMAGE_TAG} \
            .

      - name: Enforce image size budget (<20 MiB)
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          SIZE_BYTES=$(docker image inspect "${IMAGE_REF}" --format '{{.Size}}')
          LIMIT_BYTES=$((20 * 1024 * 1024))

          if [[ -z "${SIZE_BYTES}" ]]; then
            echo "error: failed to read image size for ${IMAGE_REF}" >&2
            exit 1
          fi

          echo "image_size_bytes=${SIZE_BYTES}"
          if (( SIZE_BYTES > LIMIT_BYTES )); then
            echo "error: image ${IMAGE_REF} exceeds 20 MiB budget (${SIZE_BYTES} bytes > ${LIMIT_BYTES})" >&2
            exit 1
          fi

          echo "image size within budget (<20 MiB)"

      - name: Guard fixture metadata stays template (placeholder digest)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("crates/baml-rt-tools/tests/fixtures/external-tools/sandbox_echo/tool-metadata.json")
          doc = json.loads(path.read_text(encoding="utf-8"))
          digest = doc.get("runtime_digest", "")
          expected = "sha256:" + "0" * 64
          if digest != expected:
              raise SystemExit(
                  "fixture metadata runtime_digest is no longer placeholder; "
                  "no-publish lane expects committed metadata to stay template-only"
              )

          print("fixture template digest guard passed")
          PY

      - name: Smoke test framed tool/describe roundtrip
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          python - <<'PY'
          import json
          import struct
          import subprocess

          import os

          image_ref = os.environ["IMAGE_REF"]

          request = {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tool/describe",
              "params": {},
          }
          body = json.dumps(request, separators=(",", ":")).encode("utf-8")
          framed = struct.pack(">I", len(body)) + body

          proc = subprocess.run(
              ["docker", "run", "--rm", "-i", image_ref],
              input=framed,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              check=False,
          )

          if proc.returncode != 0:
              raise SystemExit(
                  f"adapter container exited non-zero: {proc.returncode}\n"
                  f"stderr:\n{proc.stderr.decode('utf-8', errors='replace')}"
              )

          out = proc.stdout
          if len(out) < 4:
              raise SystemExit(f"stdout too short for frame header: {out!r}")

          n = struct.unpack(">I", out[:4])[0]
          payload = out[4:4+n]
          tail = out[4+n:]

          if len(payload) != n:
              raise SystemExit(f"truncated response payload: want {n}, got {len(payload)}")
          if tail:
              raise SystemExit(f"unexpected trailing bytes after frame: {tail!r}")

          response = json.loads(payload)
          assert response.get("jsonrpc") == "2.0", response
          assert response.get("id") == 1, response
          result = response.get("result")
          assert isinstance(result, dict), response
          assert result.get("tool_name") == "sandbox-echo", response
          assert result.get("protocol_version") == "1", response

          print("smoke test passed")
          PY

      - name: Resolve local image digest
        id: image_digest
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          IMAGE_ID=$(docker image inspect "${IMAGE_REF}" --format '{{.Id}}')
          if [[ -z "${IMAGE_ID}" || "${IMAGE_ID}" != sha256:* ]]; then
            echo "error: unable to resolve local sha256 image id for ${IMAGE_REF}" >&2
            exit 1
          fi
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${IMAGE_ID}" >> "$GITHUB_OUTPUT"
          echo "Resolved local image digest: ${IMAGE_ID}"

      - name: Materialize CI-local fixture metadata (no publish)
        env:
          IMAGE_REF: ${{ steps.image_digest.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.image_digest.outputs.image_digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          src = Path("crates/baml-rt-tools/tests/fixtures/external-tools/sandbox_echo/tool-metadata.json")
          dst = Path(os.environ["RUNNER_TEMP"]) / "sandbox_echo.tool-metadata.ci.json"

          with src.open("r", encoding="utf-8") as f:
            doc = json.load(f)

          doc["runtime"]["image"] = os.environ["IMAGE_REF"]
          doc["runtime"]["entrypoint"] = ["/tool-adapter"]
          doc["runtime_digest"] = os.environ["IMAGE_DIGEST"]

          with dst.open("w", encoding="utf-8") as f:
            json.dump(doc, f, indent=2)
            f.write("\n")

          print(f"wrote {dst}")
          PY

      - name: Validate CI-local fixture metadata has non-placeholder digest
        run: |
          python - <<'PY'
          import json
          import os

          path = os.path.join(os.environ["RUNNER_TEMP"], "sandbox_echo.tool-metadata.ci.json")
          with open(path, "r", encoding="utf-8") as f:
            doc = json.load(f)

          digest = doc.get("runtime_digest", "")
          if not isinstance(digest, str) or not digest.startswith("sha256:"):
            raise SystemExit(f"invalid runtime_digest: {digest!r}")
          if digest == "sha256:" + "0" * 64:
            raise SystemExit("runtime_digest is still placeholder sha256:00..")

          image = doc.get("runtime", {}).get("image", "")
          if not image.startswith("sandbox-echo-adapter:ci-"):
            raise SystemExit(f"unexpected runtime.image for no-publish lane: {image!r}")

          print("metadata validation passed")
          PY

      - name: Upload CI-local fixture metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-echo-ci-metadata
          path: ${{ runner.temp }}/sandbox_echo.tool-metadata.ci.json

  sandbox-adapter-image-handoff:
    name: Sandbox image metadata handoff validation
    runs-on: arc-runner-set
    needs: [changes, nextest, sandbox-adapter-image]
    if: needs.changes.outputs.sandbox_changed == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sandbox-echo-ci-metadata
          path: ${{ runner.temp }}/sandbox-echo-ci-metadata

      - name: Validate downloaded metadata artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("${{ runner.temp }}/sandbox-echo-ci-metadata/sandbox_echo.tool-metadata.ci.json")
          if not path.exists():
              raise SystemExit(f"artifact missing: {path}")

          doc = json.loads(path.read_text(encoding="utf-8"))
          digest = doc.get("runtime_digest", "")
          image = doc.get("runtime", {}).get("image", "")

          if not isinstance(digest, str) or not digest.startswith("sha256:"):
              raise SystemExit(f"invalid runtime_digest: {digest!r}")
          if digest == "sha256:" + "0" * 64:
              raise SystemExit("runtime_digest is placeholder sha256:00..")
          if not isinstance(image, str) or not image.startswith("sandbox-echo-adapter:ci-"):
              raise SystemExit(f"unexpected runtime.image for no-publish lane: {image!r}")

          print("downloaded metadata artifact is valid for downstream KVM E2E")
          PY
