name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read
  checks: write   # required for JUnit report action to create check runs

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_INCREMENTAL: "false"
  CARGO_PROFILE_TEST_INCREMENTAL: "false"
  RUSTFLAGS: "-C debuginfo=0 -C link-arg=-fuse-ld=gold"

jobs:
  nextest:
    name: Nextest (workspace)
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-nextest"
          cache-on-failure: true
          cache-targets: "true"

      - name: Install build dependencies
        run: |
          sudo apt update && sudo apt install -y build-essential pkg-config libssl-dev binutils-gold libclang-dev util-linux

      - name: System info
        run: |
          echo "=== lscpu ==="
          lscpu
          echo "=== nproc ==="
          nproc
          echo "=== memory (free -h) ==="
          free -h
          echo "=== uname -a ==="
          uname -a

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Single FalkorDB container for all FalkorDB tests (shared_falkordb uses
      # FALKORDB_CONNECTION when set and skips testcontainers). One init for the job.
      - name: Start FalkorDB container
        run: |
          docker pull falkordb/falkordb:latest
          docker run -d --name falkordb-ci -p 6379:6379 falkordb/falkordb:latest
          for i in $(seq 1 30); do
            if docker exec falkordb-ci redis-cli PING 2>/dev/null | grep -q PONG; then
              echo "FALKORDB_CONNECTION=falkor://127.0.0.1:6379" >> $GITHUB_ENV
              exit 0
            fi
            sleep 1
          done
          echo "FalkorDB did not become ready within 30s"
          exit 1

      - name: Run nextest
        run: |
          cargo nextest run --workspace --locked --profile ci \
            --features baml-rt-tools/http-tools,baml-rt-builder/http-tools,baml-rt-provenance/falkordb-tests,baml-rt-a2a/falkordb-tests,baml-agent-runner/falkordb-tests,baml-agent-runner/http-tools,baml-rt/llm-tests,baml-agent-runner/llm-tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FALKORDB_CONNECTION: ${{ env.FALKORDB_CONNECTION }}

      - name: Publish JUnit report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "target/nextest/ci/junit.xml"
          require_tests: false
          check_name: Nextest results

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
