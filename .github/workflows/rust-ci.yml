name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # rust-cache needs write to save cache entries
  packages: read
  checks: write   # required for JUnit report action to create check runs

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_INCREMENTAL: "false"
  CARGO_PROFILE_TEST_INCREMENTAL: "false"

jobs:
  nextest:
    name: Nextest (workspace)
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4

      - name: Ensure zstd available
        run: |
          if ! command -v zstd &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y zstd
          fi

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Enforce formatting (nightly rustfmt)
        run: cargo +nightly fmt --check

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-nextest"
          cache-on-failure: true
          cache-targets: "true"

      - name: Install build dependencies
        run: |
          sudo apt update && sudo apt install -y build-essential pkg-config libssl-dev libclang-dev util-linux lld

      - name: Install Node.js and TypeScript
        run: |
          if ! command -v node &>/dev/null; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi
          # Pin TS 6.x: builder agents rely on tsc behaviour guarded in tsconfig (e.g. rootDir ./src).
          # Unpinned `typescript` tracks latest major and can break CI without a coordinated bump.
          sudo npm install -g typescript@6
          tsc --version
          tsc --version | grep -qE '^Version 6\.' || {
            echo "error: expected global tsc 6.x (got $(tsc --version))"
            exit 1
          }

      - name: System info
        run: |
          echo "=== lscpu ==="
          lscpu
          echo "=== nproc ==="
          nproc
          echo "=== memory (free -h) ==="
          free -h
          echo "=== uname -a ==="
          uname -a

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Write fnox secrets
        # Generates fnox.toml with explicit `default` values from CI secret variables.
        # FnoxFileSecretResolver reads values directly from the file — no env var fallback.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLICKUP_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
        run: |
          cat > fnox.toml << EOF
          [secrets.OPENROUTER_API_KEY]
          description = "OpenRouter API key"
          default = "$OPENROUTER_API_KEY"

          [secrets.CLICKUP_API_KEY]
          description = "ClickUp personal API token"
          default = "$CLICKUP_API_KEY"

          [secrets.NOTION_API_TOKEN]
          description = "Notion integration token"
          default = "$NOTION_API_TOKEN"

          [secrets.SLACK_BOT_TOKEN]
          description = "Slack bot token (xoxb-...)"
          default = "$SLACK_BOT_TOKEN"

          [secrets.SLACK_USER_TOKEN]
          description = "Slack user token (xoxp-...)"
          default = "$SLACK_USER_TOKEN"
          EOF

      - name: Build regen_fixtures binary
        # Pre-build so the nextest setup script runs the binary directly
        # without re-compiling (avoids 4+ minute surrealdb compile inside
        # the 240s setup script timeout window).
        run: |
          cargo build -p baml-rt-builder --features http-tools,memory,security-eval --bin regen_fixtures
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

      - name: Run nextest
        run: |
          # Cap test parallelism to half the available cores (floor of 2) to
          # avoid saturating CPU/memory on resource-constrained CI runners.
          THREADS=$(( $(nproc) / 2 ))
          [ "$THREADS" -lt 2 ] && THREADS=2
          echo ">>> nextest parallelism: -j ${THREADS}  (nproc=$(nproc))"
          cargo nextest run --workspace --locked --profile ci --no-fail-fast \
            -j "$THREADS" \
            --features baml-rt-tools/http-tools,baml-rt-builder/http-tools,baml-agent-runner/http-tools,baml-agent-runner/memory,baml-rt/llm-tests,baml-agent-runner/llm-tests
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Publish JUnit report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "target/nextest/ci/junit.xml"
          require_tests: false
          check_name: Nextest results
