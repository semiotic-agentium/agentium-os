name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read  # required for dorny/paths-filter to list PR changed files
  actions: write  # rust-cache needs write to save cache entries
  packages: read
  checks: write   # required for JUnit report action to create check runs

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_INCREMENTAL: "false"
  CARGO_PROFILE_TEST_INCREMENTAL: "false"
  # Prefer workspace-local ONNX model cache in CI for deterministic loading.
  BAML_MODELS_DIR: ${{ github.workspace }}/models
  # Disable OTEL exporters in CI tests to avoid noisy collector connection errors
  # and timing variance when no collector is available.
  OTEL_SDK_DISABLED: "true"
  OTEL_TRACES_EXPORTER: "none"
  OTEL_METRICS_EXPORTER: "none"
  # Model id the llm-tests lane targets. Source: `vars.BAML_TEST_MODEL` repo
  # variable; fallback to the historical literal so behaviour matches main
  # when the variable is unset. See issue #429.
  BAML_TEST_MODEL: ${{ vars.BAML_TEST_MODEL || 'x-ai/grok-4.1-fast' }}
  OTEL_LOGS_EXPORTER: "none"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""

jobs:
  changes:
    name: Detect sandbox lane changes
    runs-on: arc-runner-set
    outputs:
      sandbox_changed: ${{ steps.filter.outputs.sandbox }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sandbox:
              - 'crates/baml-sandbox-adapter/**'
              - 'crates/baml-sandbox-protocol/**'
              - 'crates/baml-rt-tools/tests/fixtures/external-tools/sandbox_echo/adapter/**'
              - 'tests/fixtures/sandbox-conformance/**'
              - 'crates/baml-rt-tools/src/external_tools/metadata.rs'
              - 'crates/cargo-agent-platform/src/commands/sandbox_bind_sync.rs'
              - 'crates/cargo-agent-platform/src/commands/sandbox_oci_prepare.rs'
              - 'crates/cargo-agent-platform/src/commands/mod.rs'
              - 'crates/cargo-agent-platform/src/main.rs'
              - '.github/workflows/rust-ci.yml'

  doctor:
    name: Workspace integrity (doctor)
    runs-on: arc-runner-set
    needs: changes
    steps:
      - uses: actions/checkout@v4

      - name: Refresh apt indices (retry; mitigates mirror sync races)
        run: bash scripts/ci/apt-update-retry.sh

      - name: Install OS build deps
        run: |
          sudo apt-get install -y build-essential pkg-config libssl-dev libclang-dev lld

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Separate scope from nextest: `cargo run -p cargo-agent-platform`
          # resolves a different feature graph than the workspace nextest
          # invocation, producing distinct rlib variants for shared crates
          # (e.g. baml-rt-builder, baml-rt-tools). Sharing `ci-nextest` would
          # have nextest's save prune doctor's variants from target/.
          shared-key: "ci-doctor"
          cache-on-failure: true
          cache-targets: "true"
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

      - name: Workspace integrity check
        # `--warn-missing-catalog` downgrades unknown tool names to warnings so that agents
        # referencing external/sandbox tools (declared via tool-metadata.json, not Rust inventory)
        # do not fail CI. Doctor discovery of external tool catalogs is tracked separately.
        run: cargo run -p cargo-agent-platform -- doctor --ci --warn-missing-catalog
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

  nextest:
    name: Nextest (workspace)
    runs-on: arc-runner-set
    needs: changes
    steps:
      - uses: actions/checkout@v4

      - name: Refresh apt indices (retry; mitigates mirror sync races)
        run: bash scripts/ci/apt-update-retry.sh

      - name: Install OS build deps
        run: |
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libclang-dev clang llvm-dev util-linux lld \
            zstd git-lfs

      - name: Configure LIBCLANG_PATH for bindgen (hirofa-quickjs-sys)
        run: bash scripts/ci/set-libclang-path.sh

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Enforce formatting (nightly rustfmt)
        run: cargo +nightly fmt --check

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-nextest"
          cache-on-failure: true
          cache-targets: "true"
          # Only main pushes (and manual dispatches) repopulate the shared
          # cache. PRs restore-only — the post-job cache save would otherwise
          # cost ~9 min compressing/uploading target/ on every PR run.
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

      - name: Cache ONNX model artifacts
        id: onnx_cache
        uses: actions/cache@v4
        with:
          path: |
            models/fastembed
            ~/.cache/fastembed
          key: ${{ runner.os }}-fastembed-v1-${{ hashFiles('crates/baml-rt-embedding/Cargo.toml', 'crates/baml-rt-embedding/src/bin/download_models.rs') }}
          restore-keys: |
            ${{ runner.os }}-fastembed-v1-

      - name: Ensure ONNX model artifacts are materialized (git-lfs)
        if: steps.onnx_cache.outputs.cache-hit != 'true'
        run: |
          git lfs install --local
          # Best-effort hydrate checked-in model blobs; validation/repair happens
          # in the dedicated warm-up step via fastembed model initialization.
          git lfs pull --include="models/fastembed/**"

      - name: Install Node.js and TypeScript
        run: |
          if ! command -v node &>/dev/null; then
            for attempt in $(seq 1 5); do
              if curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash - \
                && sudo apt-get install -y nodejs; then
                break
              fi
              echo "NodeSource install failed (attempt ${attempt}/5); sleeping 30s before retry..." >&2
              if [ "$attempt" -eq 5 ]; then
                exit 1
              fi
              sleep 30
              bash scripts/ci/apt-update-retry.sh || true
            done
          fi
          # Pin TS 6.x: the canonical agent tsconfig uses `moduleResolution: "bundler"` with
          # `module: "ESNext"` (see `crates/baml-rt-builder/src/builder/compiler/tsc.rs`). The
          # runner Dockerfile installs `typescript@6` globally, so CI must match to keep
          # fixture builds consistent with the runner image. Unpinned `typescript` tracks
          # latest major and can break CI without a coordinated bump.
          sudo npm install -g typescript@6
          tsc --version
          tsc --version | grep -qE '^Version 6\.' || {
            echo "error: expected global tsc 6.x (got $(tsc --version))"
            exit 1
          }

      - name: Warm ONNX caches and validate model load
        if: steps.onnx_cache.outputs.cache-hit != 'true'
        run: |
          cargo run -p baml-rt-embedding --bin download_models
        env:
          RUSTUP_TOOLCHAIN: stable

      - name: System info
        run: |
          echo "=== lscpu ==="
          lscpu
          echo "=== nproc ==="
          nproc
          echo "=== memory (free -h) ==="
          free -h
          echo "=== uname -a ==="
          uname -a

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Write fnox secrets
        # Generates fnox.toml with explicit `default` values from CI secret variables.
        # FnoxFileSecretResolver reads values directly from the file — no env var fallback.
        # BAML_TEST_MODEL is the env-controlled test-model knob from issue #429 —
        # source: `vars.BAML_TEST_MODEL` repo variable, fallback `x-ai/grok-4.1-fast`.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLICKUP_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          BAML_TEST_MODEL: ${{ vars.BAML_TEST_MODEL || 'x-ai/grok-4.1-fast' }}
        run: |
          cat > fnox.toml << EOF
          [secrets.OPENROUTER_API_KEY]
          description = "OpenRouter API key"
          default = "$OPENROUTER_API_KEY"

          [secrets.BAML_TEST_MODEL]
          description = "Test model id (BAML env.BAML_TEST_MODEL)"
          default = "$BAML_TEST_MODEL"

          [secrets.CLICKUP_API_KEY]
          description = "ClickUp personal API token"
          default = "$CLICKUP_API_KEY"

          [secrets.NOTION_API_TOKEN]
          description = "Notion integration token"
          default = "$NOTION_API_TOKEN"

          [secrets.SLACK_BOT_TOKEN]
          description = "Slack bot token (xoxb-...)"
          default = "$SLACK_BOT_TOKEN"

          [secrets.SLACK_USER_TOKEN]
          description = "Slack user token (xoxp-...)"
          default = "$SLACK_USER_TOKEN"
          EOF

      - name: Clippy (workspace)
        run: |
          # Lints the same artifact graph the nextest step below compiles, so
          # the workspace `target/` warmed by this step is reused — net cost
          # is the rmeta diff, not a second cold workspace build.
          # Feature set must stay aligned with the nextest step's --features
          # list; `--all-features` is explicitly forbidden (see comment there)
          # because `sandbox-e2e-kvm` must only compile in the dedicated KVM
          # workflow. Catches workspace-clippy regressions like #419 on every
          # PR — the bar `CLAUDE.md` and the pre-commit hook prescribe.
          cargo clippy --workspace --all-targets --locked \
            --exclude baml-sandbox-adapter --exclude baml-sandbox-protocol --exclude sandbox-echo-adapter \
            --features baml-rt-tools/http-tools,baml-rt-builder/http-tools,baml-rt-builder/llm-tests,baml-agent-runner/http-tools,baml-agent-runner/memory,baml-rt/llm-tests,baml-agent-runner/llm-tests \
            -- -D warnings
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

      - name: Run nextest (workspace)
        run: |
          # Single workspace pass with the union feature set (LLM + non-LLM).
          # Tests gated by #[cfg(feature = "llm-tests")] compile when llm-tests is enabled,
          # producing one artifact graph that contains every test.
          # IMPORTANT: keep explicit feature list here (do NOT switch to --all-features).
          # `sandbox-e2e-kvm` must only compile in .github/workflows/sandbox-e2e-kvm.yml
          # on KVM-capable runners.
          echo ">>> nextest workspace: full parallelism (nproc=$(nproc))"
          # Sandbox protocol/adapter coverage is owned by downstream sandbox jobs
          # in this workflow; excluding them here keeps each test in one lane.
          # `baml-agent-runner/cluster-tests` deferred from CI: the k3d cluster
          # setup over-commits the 2-vCPU GitHub runner, starving the rest of
          # the suite (see #367). Re-enable once cluster tests run on isolated
          # infrastructure.
          cargo nextest run --workspace --locked --profile ci-merged --no-fail-fast \
            --exclude baml-sandbox-adapter --exclude baml-sandbox-protocol --exclude sandbox-echo-adapter \
            --features baml-rt-tools/http-tools,baml-rt-builder/http-tools,baml-rt-builder/llm-tests,baml-agent-runner/http-tools,baml-agent-runner/memory,baml-rt/llm-tests,baml-agent-runner/llm-tests
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OTEL_SDK_DISABLED: "true"
          OTEL_TRACES_EXPORTER: "none"
          OTEL_METRICS_EXPORTER: "none"
          OTEL_LOGS_EXPORTER: "none"
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ""

      - name: Publish JUnit report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "target/nextest/ci-merged/junit.xml"
          require_tests: false
          check_name: Nextest results

  sandbox-adapter:
    name: Sandbox adapter (stdio E2E + protocol)
    runs-on: arc-runner-set
    needs: [changes, nextest]
    if: needs.changes.outputs.sandbox_changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-sandbox-adapter"
          cache-on-failure: true
          cache-targets: "true"

      - name: Install build dependencies
        run: |
          sudo apt update && sudo apt install -y build-essential pkg-config libclang-dev clang llvm-dev lld

      - name: Configure LIBCLANG_PATH for bindgen (hirofa-quickjs-sys)
        run: bash scripts/ci/set-libclang-path.sh

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build echo adapter fixture
        run: cargo build -p sandbox-echo-adapter --locked
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

      - name: Clippy
        run: |
          cargo clippy \
            -p baml-sandbox-adapter \
            -p baml-sandbox-protocol \
            --all-targets --locked -- -D warnings

      - name: Nextest
        run: |
          cargo nextest run \
            -p baml-sandbox-adapter \
            -p baml-sandbox-protocol \
            --locked --profile ci --no-fail-fast
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

      - name: Conformance digest check (Rust authority)
        run: |
          cargo test -p baml-rt-tools schema_digest_matches_conformance_fixture --locked -- --nocapture
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

      - name: Sandbox sidecar parity checks (bind + OCI)
        run: |
          cargo test -p cargo-agent-platform write_runtime_sidecars_materializes_expected_files --locked -- --ignored --nocapture
          cargo test -p cargo-agent-platform sandbox_oci_prepare --locked -- --ignored --nocapture
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

      - name: Publish JUnit report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "target/nextest/ci/junit.xml"
          require_tests: true
          check_name: Sandbox adapter nextest

  sandbox-adapter-image:
    name: Sandbox adapter image (no-publish)
    runs-on: arc-runner-set
    needs: [changes, nextest]
    if: needs.changes.outputs.sandbox_changed == 'true'
    env:
      IMAGE_NAME: sandbox-echo-adapter
      IMAGE_TAG: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally (no push)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -f crates/baml-rt-tools/tests/fixtures/external-tools/sandbox_echo/adapter/Dockerfile \
            -t ${IMAGE_NAME}:${IMAGE_TAG} \
            .

      - name: Enforce image size budget (<20 MiB)
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          SIZE_BYTES=$(docker image inspect "${IMAGE_REF}" --format '{{.Size}}')
          LIMIT_BYTES=$((20 * 1024 * 1024))

          if [[ -z "${SIZE_BYTES}" ]]; then
            echo "error: failed to read image size for ${IMAGE_REF}" >&2
            exit 1
          fi

          echo "image_size_bytes=${SIZE_BYTES}"
          if (( SIZE_BYTES > LIMIT_BYTES )); then
            echo "error: image ${IMAGE_REF} exceeds 20 MiB budget (${SIZE_BYTES} bytes > ${LIMIT_BYTES})" >&2
            exit 1
          fi

          echo "image size within budget (<20 MiB)"

      - name: Guard fixture metadata stays template (placeholder digest)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("crates/baml-rt-tools/tests/fixtures/external-tools/sandbox_echo/tool-metadata.json")
          doc = json.loads(path.read_text(encoding="utf-8"))
          expected = "sha256:" + "0" * 64

          image = doc.get("runtime", {}).get("image", "")
          if not isinstance(image, str) or expected not in image:
              raise SystemExit(
                  "fixture metadata runtime.image is no longer placeholder; "
                  "no-publish lane expects committed metadata to stay template-only"
              )

          print("fixture template digest guard passed")
          PY

      - name: Smoke test framed tool/describe roundtrip
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          python - <<'PY'
          import json
          import struct
          import subprocess

          import os

          image_ref = os.environ["IMAGE_REF"]

          request = {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tool/describe",
              "params": {},
          }
          body = json.dumps(request, separators=(",", ":")).encode("utf-8")
          framed = struct.pack(">I", len(body)) + body

          proc = subprocess.run(
              ["docker", "run", "--rm", "-i", image_ref],
              input=framed,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              check=False,
          )

          if proc.returncode != 0:
              raise SystemExit(
                  f"adapter container exited non-zero: {proc.returncode}\n"
                  f"stderr:\n{proc.stderr.decode('utf-8', errors='replace')}"
              )

          out = proc.stdout
          if len(out) < 4:
              raise SystemExit(f"stdout too short for frame header: {out!r}")

          n = struct.unpack(">I", out[:4])[0]
          payload = out[4:4+n]
          tail = out[4+n:]

          if len(payload) != n:
              raise SystemExit(f"truncated response payload: want {n}, got {len(payload)}")
          if tail:
              raise SystemExit(f"unexpected trailing bytes after frame: {tail!r}")

          response = json.loads(payload)
          assert response.get("jsonrpc") == "2.0", response
          assert response.get("id") == 1, response
          result = response.get("result")
          assert isinstance(result, dict), response
          assert result.get("tool_name") == "sandbox-echo", response
          assert result.get("protocol_version") == "1", response

          print("smoke test passed")
          PY

      - name: Resolve local image digest
        id: image_digest
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          IMAGE_ID=$(docker image inspect "${IMAGE_REF}" --format '{{.Id}}')
          if [[ -z "${IMAGE_ID}" || "${IMAGE_ID}" != sha256:* ]]; then
            echo "error: unable to resolve local sha256 image id for ${IMAGE_REF}" >&2
            exit 1
          fi
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${IMAGE_ID}" >> "$GITHUB_OUTPUT"
          echo "Resolved local image digest: ${IMAGE_ID}"

      - name: Materialize CI-local fixture metadata (no publish)
        env:
          IMAGE_REF: ${{ steps.image_digest.outputs.image_ref }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          src = Path("crates/baml-rt-tools/tests/fixtures/external-tools/sandbox_echo/tool-metadata.json")
          dst = Path(os.environ["RUNNER_TEMP"]) / "sandbox_echo.tool-metadata.ci.json"

          with src.open("r", encoding="utf-8") as f:
            doc = json.load(f)

          doc["runtime"]["image"] = os.environ["IMAGE_REF"]

          with dst.open("w", encoding="utf-8") as f:
            json.dump(doc, f, indent=2)
            f.write("\n")

          print(f"wrote {dst}")
          PY

      - name: Validate CI-local fixture metadata has materialized image
        run: |
          python - <<'PY'
          import json
          import os

          path = os.path.join(os.environ["RUNNER_TEMP"], "sandbox_echo.tool-metadata.ci.json")
          with open(path, "r", encoding="utf-8") as f:
            doc = json.load(f)

          image = doc.get("runtime", {}).get("image", "")
          if not image.startswith("sandbox-echo-adapter:ci-"):
            raise SystemExit(f"unexpected runtime.image for no-publish lane: {image!r}")

          print("metadata validation passed")
          PY

      - name: Upload CI-local fixture metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-echo-ci-metadata
          path: ${{ runner.temp }}/sandbox_echo.tool-metadata.ci.json

  sandbox-adapter-image-handoff:
    name: Sandbox image metadata handoff validation
    runs-on: arc-runner-set
    needs: [changes, nextest, sandbox-adapter-image]
    if: needs.changes.outputs.sandbox_changed == 'true'
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: sandbox-echo-ci-metadata
          path: ${{ runner.temp }}/sandbox-echo-ci-metadata

      - name: Validate downloaded metadata artifact
        env:
          METADATA_DIR: ${{ runner.temp }}/sandbox-echo-ci-metadata
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["METADATA_DIR"]) / "sandbox_echo.tool-metadata.ci.json"
          if not path.exists():
              raise SystemExit(f"artifact missing: {path}")

          doc = json.loads(path.read_text(encoding="utf-8"))
          image = doc.get("runtime", {}).get("image", "")

          if not isinstance(image, str) or not image.startswith("sandbox-echo-adapter:ci-"):
              raise SystemExit(f"unexpected runtime.image for no-publish lane: {image!r}")

          print("downloaded metadata artifact is valid for downstream KVM E2E")
          PY
