name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # rust-cache needs write to save cache entries
  packages: read
  checks: write   # required for JUnit report action to create check runs

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_INCREMENTAL: "false"
  CARGO_PROFILE_TEST_INCREMENTAL: "false"

jobs:
  nextest:
    name: Nextest (workspace)
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4

      - name: Ensure zstd available
        run: |
          if ! command -v zstd &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y zstd
          fi

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Enforce formatting (nightly rustfmt)
        run: cargo +nightly fmt --check

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-nextest"
          cache-on-failure: true
          cache-targets: "true"

      - name: Install build dependencies
        run: |
          sudo apt update && sudo apt install -y build-essential pkg-config libssl-dev libclang-dev util-linux

      - name: System info
        run: |
          echo "=== lscpu ==="
          lscpu
          echo "=== nproc ==="
          nproc
          echo "=== memory (free -h) ==="
          free -h
          echo "=== uname -a ==="
          uname -a

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        env:
          RUSTUP_TOOLCHAIN: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run nextest
        run: |
          cargo nextest run --workspace --locked --profile ci --no-fail-fast \
            --features baml-rt-tools/http-tools,baml-rt-builder/http-tools,baml-agent-runner/http-tools,baml-agent-runner/memory,baml-rt/llm-tests,baml-agent-runner/llm-tests
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=bfd"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Publish JUnit report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "target/nextest/ci/junit.xml"
          require_tests: false
          check_name: Nextest results
