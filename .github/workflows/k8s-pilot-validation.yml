name: K8s Pilot Validation

# Pre-merge validator: scripts/verify-k8s-pilot-package.sh on k3d via Argo CD
# and local registry push. Trusted CI only — not fork PRs. See
# docs/runbooks/ci-security.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_INCREMENTAL: "false"
  CARGO_PROFILE_TEST_INCREMENTAL: "false"
  OTEL_SDK_DISABLED: "true"
  OTEL_TRACES_EXPORTER: "none"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""

jobs:
  changes:
    name: Detect pilot lane changes
    runs-on: ubuntu-latest
    outputs:
      pilot: ${{ steps.filter.outputs.pilot }}
      trusted: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pilot:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Dockerfile'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'models/fastembed/**'
              - 'tests/fixtures/agents/dispatch-echo/**'
              - 'deploy/helm/**'
              - 'deploy/k3d/**'
              - 'deploy/argocd/**'
              - 'deploy/values/**'
              - 'docker/agentium-argocd-sync.Dockerfile'
              - 'scripts/verify-k8s-pilot-package.sh'
              - 'scripts/k8s-pilot-smoke.sh'
              - 'scripts/e2e-k8s/**'
              - 'scripts/release/**'
              - '.github/workflows/k8s-pilot-validation.yml'

  validate:
    name: Argo CD + registry package validation
    runs-on: arc-runner-set
    needs: changes
    if: |
      needs.changes.outputs.trusted == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.pilot == 'true')
    timeout-minutes: 60
    permissions:
      # rust-cache needs write to save cache entries; the changes job
      # only runs paths-filter and inherits read-only.
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Refresh apt indices (retry; mitigates mirror sync races)
        run: bash scripts/ci/apt-update-retry.sh

      - name: Install OS deps
        # build-essential / pkg-config / libssl-dev / libclang-dev / lld
        # are needed by `cargo run -p agentium` during the
        # smoke step. zstd + git-lfs hydrate the embedded ONNX models the
        # Dockerfile copies into the runtime image.
        run: |
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libclang-dev lld \
            curl jq ca-certificates git-lfs zstd

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Distinct from ci-nextest: this job compiles
          # cargo-agent-platform host-side via `cargo run` during smoke,
          # producing a different feature graph than the workspace
          # nextest invocation.
          shared-key: "ci-k8s-pilot"
          cache-on-failure: true
          cache-targets: "true"
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

      - name: Install Node.js and TypeScript
        # cargo-agent-platform compiles the dispatch-echo fixture's
        # TypeScript during `push`, so the host runner needs node + tsc.
        # Pin TS 6.x to match the rest of CI (rust-ci.yml nextest).
        run: |
          if ! command -v node &>/dev/null; then
            for attempt in $(seq 1 5); do
              if curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash - \
                && sudo apt-get install -y nodejs; then
                break
              fi
              echo "NodeSource install failed (attempt ${attempt}/5); sleeping 30s before retry..." >&2
              if [ "$attempt" -eq 5 ]; then
                exit 1
              fi
              sleep 30
              bash scripts/ci/apt-update-retry.sh || true
            done
          fi
          sudo npm install -g typescript@6
          tsc --version
          tsc --version | grep -qE '^Version 6\.' || {
            echo "error: expected global tsc 6.x (got $(tsc --version))"
            exit 1
          }

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.4'

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.4'

      - name: Install k3d
        run: |
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh \
            | TAG=v5.7.4 bash
          k3d version

      - name: Materialize ONNX model artifacts (git-lfs)
        # The Dockerfile copies models/fastembed and fails the build if
        # ONNX files are still LFS pointer stubs.
        run: |
          git lfs install --local
          git lfs pull --include="models/fastembed/**"

      - name: System info
        run: |
          echo "=== docker info ==="
          docker info || true
          echo "=== nproc ==="
          nproc
          echo "=== free -h ==="
          free -h

      - name: Run authoritative validator (Argo + registry)
        run: |
          AGENTIUM_FIXED_TAG="ci-$(git rev-parse --short HEAD)" \
            bash scripts/e2e-k8s/image-tag-nonce.sh
          ./scripts/verify-k8s-pilot-package.sh
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

      - name: Upload e2e-k8s logs on failure
        # The script's cleanup trap dumps pod logs + cluster_runners
        # JSON to ./e2e-k8s-logs/verify-<timestamp>/ before tearing
        # down the cluster.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-pilot-validation-logs-${{ github.run_id }}
          path: e2e-k8s-logs/
          if-no-files-found: ignore
          retention-days: 14

  validate-fork-skipped:
    name: Argo CD + registry package validation (fork — skipped)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.trusted != 'true' &&
      (github.event_name == 'pull_request' && needs.changes.outputs.pilot == 'true')
    steps:
      - name: Explain skipped k8s validation
        run: |
          echo "::notice title=Fork PR — k8s pilot validation skipped::Untrusted fork PRs do not run k3d/Argo on self-hosted runners. Full validation runs on push to main after merge, or via workflow_dispatch on a trusted branch. See docs/runbooks/ci-security.md"
