name: LLM Smoke Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  llm-smoke:
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: 'llm-smoke'
          cache-on-failure: true
          cache-targets: 'false'

      - name: Install build dependencies
        run: |
          sudo apt update && sudo apt install -y build-essential pkg-config libssl-dev binutils-gold libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run LLM smoke tests
        run: |
          cargo test --locked -p baml-rt --features llm-tests -j 1 -- --test-threads=1
          cargo test --locked -p baml-agent-runner --features llm-tests -j 1 -- --test-threads=1
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
