name: Sandbox Adapter

# Path-filtered lane for the sandbox tool adapter SDK + its shared wire
# crate. Main `rust-ci.yml` excludes these crates from its workspace
# nextest so each sandbox test runs in exactly one lane (§20 of
# tool_sandbox.md). Trigger paths include this workflow file itself so
# edits here re-trigger the lane for validation.

on:
  push:
    branches: [main]
    paths:
      - 'crates/baml-sandbox-adapter/**'
      - 'crates/baml-sandbox-protocol/**'
      - 'crates/baml-rt-tools/tests/fixtures/external-tools/sandbox_echo/adapter/**'
      - '.github/workflows/sandbox-adapter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/baml-sandbox-adapter/**'
      - 'crates/baml-sandbox-protocol/**'
      - 'crates/baml-rt-tools/tests/fixtures/external-tools/sandbox_echo/adapter/**'
      - '.github/workflows/sandbox-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # rust-cache needs write to save cache entries
  checks: write   # required for JUnit report action to create check runs

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_INCREMENTAL: "false"
  CARGO_PROFILE_TEST_INCREMENTAL: "false"

jobs:
  sandbox-adapter:
    name: Sandbox adapter (stdio E2E + protocol)
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-sandbox-adapter"
          cache-on-failure: true
          cache-targets: "true"

      - name: Install build dependencies
        run: |
          sudo apt update && sudo apt install -y build-essential pkg-config lld

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build echo adapter fixture
        # `assert_cmd::cargo_bin` in the stdio E2E resolves the binary by
        # filesystem path and does not trigger a build, so the fixture
        # must be compiled explicitly before the test run.
        run: cargo build -p sandbox-echo-adapter --locked
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

      - name: Clippy
        run: |
          cargo clippy \
            -p baml-sandbox-adapter \
            -p baml-sandbox-protocol \
            --all-targets --locked -- -D warnings

      - name: Nextest
        run: |
          cargo nextest run \
            -p baml-sandbox-adapter \
            -p baml-sandbox-protocol \
            --locked --profile ci --no-fail-fast
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

      - name: Publish JUnit report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "target/nextest/ci/junit.xml"
          require_tests: true
          check_name: Sandbox adapter nextest
