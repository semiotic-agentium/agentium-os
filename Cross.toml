# Cross-compilation image hooks for release builds (see scripts/release/build-release-binaries.sh).
#
# aarch64-gnu needs arm64 sysroot headers for dbus/cap-ng (memory/keyring + sandbox).

[target.aarch64-unknown-linux-gnu]
# Use the cross `main` image (Ubuntu 20.04 / focal). The released-cross default
# (0.2.5) is Ubuntu 16.04 / xenial, whose libclang is ancient (3.8) and whose apt
# can no longer install a modern clang: apt.llvm.org dropped xenial after LLVM 12,
# and xenial's old apt rejects apt.llvm.org's rotated armored signing key
# (NO_PUBKEY ... unauthenticated). focal carries clang 10 in its own (already
# enabled) universe repo, so we drop the apt.llvm.org dance entirely.
#
# clang/libclang-dev: hirofa-quickjs-sys runs bindgen inside the container, which
# needs libclang (host installs don't reach the cross image); clang 10 is new
# enough (bindgen needs >=9). We symlink focal's /usr/lib/llvm-10/lib (the version
# is fixed — focal is a frozen LTS) to a stable path and have
# build-release-binaries.sh set LIBCLANG_PATH=/opt/libclang-current. arm64 dev
# libs: libdbus-sys (memory/keyring) + libcap-ng (sandbox) probe via pkg-config;
# their .pc files land in /usr/lib/aarch64-linux-gnu/pkgconfig (the build script's
# PKG_CONFIG_PATH).
#
# `main` is a floating tag (rebuilt periodically); pin a digest here if the build
# must be byte-reproducible. The whole pre-build is verified against the focal
# image before each bump.
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update",
    "apt-get install --assume-yes ca-certificates pkg-config clang libclang-dev llvm-dev libdbus-1-dev:arm64 libcap-ng-dev:arm64",
    "ln -sfn /usr/lib/llvm-10/lib /opt/libclang-current && ls -l /opt/libclang-current/libclang.so* && clang --version",
]

[build.env]
# Forward the pkg-config cross settings that build-release-binaries.sh exports
# into the container. libdbus-sys / libcap-ng probe via the pkg_config crate,
# which aborts when host != target unless PKG_CONFIG_ALLOW_CROSS=1;
# PKG_CONFIG_PATH points at the arm64 multiarch .pc files installed above.
#
# microsandbox's build.rs writes to $HOME/.microsandbox/ when the
# sandbox-provider feature is enabled. build-release-binaries.sh injects a
# container-only HOME via CROSS_CONTAINER_OPTS; do not passthrough host HOME or
# poison cross/rustup preflight on the host.
passthrough = [
    "LIBCLANG_PATH",
    "PKG_CONFIG_ALLOW_CROSS",
    "PKG_CONFIG_PATH",
]
