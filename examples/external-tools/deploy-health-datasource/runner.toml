# Runner config for the raw external-datasource demo.
#
# `[external_tools].dirs` lists webhook datasource manifest dirs. The runner
# reads tool-manifest.json at boot; no process runs.
#
# Paths here are resolved relative to THIS file's directory, and this file lives
# inside the tool dir, so the entry is ".".
[external_tools]
dirs = ["."]

# Presence of an entry = ACTIVATION. Listing the dir (above) is necessary but not
# sufficient: the datasource is only mounted when it is also activated here.
# Delete this section and the webhook route disappears on next boot.
#
# Keyed by "<tool name>"."<datasource key>". `source_key` is omitted, so it
# falls back to the manifest default ("deploy-health:local"); set it here to
# override per deployment (prod vs staging) without editing the manifest.
[external_datasources."examples/deploy-health-datasource"."events"]
# source_key = "deploy-health:prod"
