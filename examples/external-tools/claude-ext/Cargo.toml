[package]
name = "external-tool"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "io-util", "io-std", "process"] }
tokio-util = "0.7"
dashmap = "6"
async-trait = "0.1"

[features]
default = []
sdk-engine = []

