[workspace]
members = [
    "crates/baml-agent-runner",
    "crates/baml-derive-tests",
    "crates/baml-rt",
    "crates/baml-rt-a2a",
    "crates/baml-rt-builder",
    "crates/baml-rt-core",
    "crates/baml-derive-tests",
    "crates/baml-rt-id",
    "crates/baml-rt-interceptor",
    "crates/baml-rt-observability",
    "crates/baml-rt-provenance",
    "crates/baml-rt-quickjs",
    "crates/baml-rt-tools",
    "crates/test-support",
    "crates/tools/internal-dev",
]
default-members = [
    "crates/baml-rt-core",
    "crates/baml-rt-id",
    "crates/baml-rt-observability",
    "crates/baml-rt-interceptor",
    "crates/baml-rt-quickjs",
    "crates/baml-rt-tools",
    "crates/baml-rt-a2a",
    "crates/baml-rt-provenance",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["BAML Runtime Team"]
description = "BAML Runtime"

[workspace.dependencies]
clap = { version = "4.4", features = ["derive"] }
oxc_parser = "0.112"
oxc_allocator = "0.112"
oxc_span = "0.112"
oxc_codegen = "0.112"
oxc_transformer = "0.112"
oxc_semantic = "0.112"
quickjs_runtime = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-channel = "2"
regex = "1.0"
async-trait = "0.1"
flate2 = "1.0"
tar = "0.4"
tokio-test = "0.4"
tracing-test = "0.2"
tempfile = "3.10"
dotenvy = "0.15"
opentelemetry = "0.26"
opentelemetry_sdk = "0.26"
tracing-opentelemetry = "0.27"
tokio-tungstenite = "0.28.0"
futures-util = "0.3.31"
text-to-cypher = { version = "0.1", default-features = false }
testcontainers = "0.23"
insta = "1.46.3"
uuid = { version = "1.10", features = ["v4", "serde"] }
baml-runtime = { git = "https://github.com/BoundaryML/baml", rev = "d2cc1034826f3b56fa0ad3bcb5c4424de2de8b1c" }
baml-types = { git = "https://github.com/BoundaryML/baml", rev = "d2cc1034826f3b56fa0ad3bcb5c4424de2de8b1c" }
internal-baml-core = { git = "https://github.com/BoundaryML/baml", rev = "d2cc1034826f3b56fa0ad3bcb5c4424de2de8b1c" }
schemars = "1.1.0"
ts-rs = "11.1.0"
genco = "0.19.0"
inventory = "0.3.20"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
# Pinned: h2 0.4.13 / hyper-util 0.1.20 introduce TLS regression with rustls
# ("decryption failed or bad record mac" connecting to OpenRouter).
# Bump deliberately after testing; do not use `cargo generate-lockfile`.
reqwest = { version = "=0.12.26", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
http-api-problem = { version = "0.60", features = ["axum"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.test]
opt-level = 0
debug = true
