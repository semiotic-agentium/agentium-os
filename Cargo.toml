[workspace]
members = [
  "crates/baml-agent-runner",
  "crates/baml-derive-tests",
  "crates/cargo-agent-platform",
  "crates/baml-tool-links",
  "crates/integrations/clickup-client",
  "crates/integrations/github-client",
  "crates/integrations/notion-read",
  "crates/integrations/slack-read",
  "crates/baml-rt",
  "crates/baml-rt-a2a",
  "crates/baml-rt-builder",
  "crates/baml-rt-config",
  "crates/baml-rt-citation",
  "crates/baml-rt-conversation",
  "crates/baml-rt-core",
  "crates/baml-rt-embedding",
  "crates/baml-rt-hash",
  "crates/baml-rt-id",
  "crates/baml-rt-interceptor",
  "crates/baml-rt-llm-config",
  "crates/baml-rt-observability",
  "crates/baml-rt-provenance",
  "crates/baml-rt-quickjs",
  "crates/baml-rt-repository",
  "crates/baml-rt-router",
  "crates/baml-rt-tools",
  "crates/baml-sandbox-adapter",
  "crates/baml-sandbox-protocol",
  "crates/baml-rt-tools/tests/fixtures/external-tools/sandbox_echo/adapter",
  "crates/test-support",
  "crates/task-daemon",
  "crates/tools/calculator",
  "crates/tools/claude",
  "crates/tools/internal-dev",
  "crates/tools/security-eval",
  "crates/tools/clickup",
  "crates/tools/slack",
  "crates/tools/notion",
  "crates/tools/system",
  "crates/tools/memory",
  "crates/tools/mcp",
  "crates/baml-tool-derive",
]
default-members = [
  "crates/baml-rt-citation",
  "crates/baml-rt-conversation",
  "crates/baml-rt-core",
  "crates/baml-rt-id",
  "crates/baml-rt-observability",
  "crates/baml-rt-interceptor",
  "crates/baml-rt-quickjs",
  "crates/baml-rt-tools",
  "crates/baml-rt-a2a",
  "crates/baml-rt-provenance",
  "crates/task-daemon",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["BAML Runtime Team"]
description = "BAML Runtime"

[workspace.dependencies]
# Core
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
  "macros",
  "io-std",
  "io-util",
  "net",
  "process",
] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.26"
opentelemetry_sdk = "0.26"
opentelemetry-http = "0.26"
tracing-opentelemetry = "0.27"
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.31"
libc = "0.2"
testcontainers = "0.23"
testcontainers-modules = { version = "0.15", default-features = false, features = ["surrealdb"] }
insta = { version = "1.46.3", features = ["json"] }
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
schemars = "1.1.0"
jsonschema = "0.18"
ts-rs = "11.1.0"
genco = "0.19.0"
inventory = "0.3.20"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
# Pinned: h2 0.4.13 / hyper-util 0.1.20 introduce TLS regression with rustls
# ("decryption failed or bad record mac" connecting to OpenRouter).
# Bump deliberately after testing; do not use `cargo generate-lockfile`.
reqwest = { version = "=0.12.26", default-features = false, features = [
  "json",
  "rustls-tls",
] }
url = "2"
regex = "1"
async-channel = "2"
async-stream = "0.3"
futures-core = "0.3"
sha2 = "0.10"
subtle = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
tar = "0.4"
# Minimal QuickJS runtime: no SWC/typescript (agents are pre-compiled by the builder),
# no timer APIs (unused), no console (we inject our own sandboxed polyfill).
quickjs_runtime = { version = "0.15", default-features = false, features = ["bellard"] }
# Agent memory
agentic-memory = "0.2.6"
# SurrealDB — embedded (kv-mem, kv-surrealkv) and remote (protocol-ws) backends.
surrealdb = { version = "3", default-features = false, features = ["kv-mem", "kv-surrealkv", "protocol-ws"] }
# Embedding / drift detection
fastembed = { version = "4", default-features = false, features = ["ort-download-binaries", "hf-hub-native-tls"] }
dashmap = "6"
axum = "0.8"
# Testing / dev
paste = "1"
tokio-test = "0.4"
tokio-util = { version = "0.7", features = ["rt"] }
tracing-test = "0.2"
tempfile = "3"
dotenvy = "0.15"
proptest = "1"
# Builder / tools
inquire = "0.9"
# MCP client SDK. PR 4 uses `transport-child-process` for stdio servers.
rmcp = { version = "1.7", default-features = false, features = [
  "client",
  "transport-child-process",
] }
# API
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
http-api-problem = { version = "0.60", features = ["axum"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
# BAML (fork with minimal-runtime; branch for softer semver)
baml-runtime = { git = "https://github.com/ryan-s-roberts/baml", branch = "canary", default-features = false, features = [
  "minimal-runtime",
  "internal",
] }
baml-types = { git = "https://github.com/ryan-s-roberts/baml", branch = "canary" }
internal-baml-core = { git = "https://github.com/ryan-s-roberts/baml", branch = "canary" }
internal-llm-client = { git = "https://github.com/ryan-s-roberts/baml", branch = "canary" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.test]
opt-level = 0
debug = "line-tables-only"
